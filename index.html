@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
.font-display { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; }
.tnum { font-variant-numeric: tabular-nums; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pop { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.a-rise { animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
.a-pop { animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
.a-fade { animation: fadein 0.2s ease both; }
.d1 { animation-delay: 0.04s; } .d2 { animation-delay: 0.08s; }
.d3 { animation-delay: 0.12s; } .d4 { animation-delay: 0.16s; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
select { background-image: none; }
* { -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
button { touch-action: manipulation; }
@media (max-width: 1023px) {
  input, select, textarea { font-size: 16px !important; }
}
.toast-wrap { bottom: calc(6.75rem + env(safe-area-inset-bottom)); }
@media (min-width: 1024px) { .toast-wrap { bottom: 1.5rem; } }
