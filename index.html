function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.circle}</svg>`}
function uid(prefix='id'){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function currentMonth(){return today().slice(0,7)}
function monthShift(m,offset){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+offset,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabel(m,opts={month:'long',year:'numeric'}){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString(undefined,opts)}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return false;const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}
function normalizeText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function sum(arr,fn=x=>x){return arr.reduce((a,x)=>a+(Number(fn(x))||0),0)}
function median(arr){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function parseDecimal(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;let s=String(v??'').trim().replace(/[\s\u00a0€$£¥]/g,'');if(!s)return NaN;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}if(s.startsWith('-')){neg=true;s=s.slice(1)}if(s.startsWith('+'))s=s.slice(1);const dot=s.lastIndexOf('.'),comma=s.lastIndexOf(',');if(dot>=0&&comma>=0){if(comma>dot)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(comma>=0){const p=s.length-comma-1;s=p<=2?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(dot>=0){const p=s.length-dot-1;if(p>2)s=s.replace(/\./g,'')}const n=Number(s);return Number.isFinite(n)?(neg?-n:n):NaN}
function minorFromInput(v,currency){const n=parseDecimal(v);if(!Number.isFinite(n))return NaN;const digits=(CURRENCIES[currency]||CURRENCIES.EUR).digits;return Math.round(n*Math.pow(10,digits))}
function majorFromMinor(n,currency){const digits=(CURRENCIES[currency]||CURRENCIES.EUR).digits;return (Number(n)||0)/Math.pow(10,digits)}
function money(n,currency=state?.settings?.currency||'EUR',signed=false){const value=majorFromMinor(n,currency);const f=new Intl.NumberFormat(undefined,{style:'currency',currency,maximumFractionDigits:(CURRENCIES[currency]||CURRENCIES.EUR).digits});return signed?(value>0?'+':'')+f.format(value):f.format(value)}
function compactMoney(n,currency=state?.settings?.currency||'EUR'){const value=majorFromMinor(n,currency);return new Intl.NumberFormat(undefined,{style:'currency',currency,notation:'compact',maximumFractionDigits:1}).format(value)}
function pctChange(now,prev){if(prev===0)return now===0?null:100;return (now-prev)/Math.abs(prev)*100}
function safeJsonParse(s){try{return JSON.parse(s)}catch{return null}}
function loadDriveConfig(){const fallback={clientId:'',fileId:'',autoSync:true,lastSyncAt:0};let cfg=fallback;try{const saved=safeJsonParse(localStorage.getItem(DRIVE_CONFIG_KEY));if(saved&&typeof saved==='object')cfg={...fallback,...saved}}catch{}if(!cfg.clientId){try{const mirror=String(localStorage.getItem(DRIVE_ID_MIRROR_KEY)||'').trim();if(mirror)cfg={...cfg,clientId:mirror}}catch{}}return cfg}
function saveDriveConfig(patch={}){const next={...loadDriveConfig(),...patch};next.clientId=String(next.clientId||'').trim();next.fileId=String(next.fileId||'').trim();next.autoSync=next.autoSync!==false;next.lastSyncAt=Number(next.lastSyncAt)||0;try{localStorage.setItem(DRIVE_CONFIG_KEY,JSON.stringify(next))}catch{}if(next.clientId){try{localStorage.setItem(DRIVE_ID_MIRROR_KEY,next.clientId)}catch{}}return next}
function applyLocalDriveConfig(target){if(!target?.settings)return target;const cfg=loadDriveConfig(),embedded=String(target.settings.googleClientId||'').trim();if(cfg.clientId)target.settings.googleClientId=cfg.clientId;else if(embedded)saveDriveConfig({clientId:embedded});return target}
let clientIdTimer=null;
function rememberClientId(v){const value=String(v||'').trim();clearTimeout(clientIdTimer);clientIdTimer=setTimeout(()=>{if(!value)return;saveDriveConfig({clientId:value});try{if(state&&state.settings&&state.settings.googleClientId!==value){state.settings.googleClientId=value;saveState({skipDrive:true})}}catch{}refreshDriveChip()},300)}
function loadStoredDriveToken(){try{const saved=safeJsonParse(localStorage.getItem(DRIVE_TOKEN_KEY));return saved?.token&&Number(saved.exp)>Date.now()+60000?saved:null}catch{return null}}
function saveStoredDriveToken(token){try{localStorage.setItem(DRIVE_TOKEN_KEY,JSON.stringify(token))}catch{}}
function clearStoredDriveToken(){try{localStorage.removeItem(DRIVE_TOKEN_KEY)}catch{}}
function isStandaloneApp(){return navigator.standalone===true||(typeof matchMedia==='function'&&matchMedia('(display-mode: standalone)').matches===true)}
function startDriveRedirect(clientId){const nonce=Math.random().toString(36).slice(2)+Date.now().toString(36);const record=JSON.stringify({n:nonce,c:String(clientId||'').trim(),t:Date.now()});try{localStorage.setItem(DRIVE_NONCE_KEY,record)}catch{}try{sessionStorage.setItem(DRIVE_NONCE_KEY,record)}catch{}const params=new URLSearchParams({client_id:clientId,redirect_uri:location.origin+location.pathname,response_type:'token',scope:DRIVE_SCOPE,include_granted_scopes:'true',state:nonce});location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+params.toString())}
function readDriveRedirectToken(){if(!location.hash.includes('access_token='))return null;const params=new URLSearchParams(location.hash.replace(/^#/,'')),token=params.get('access_token'),stateParam=params.get('state'),expires=Number(params.get('expires_in')||3600);let stored='';try{stored=localStorage.getItem(DRIVE_NONCE_KEY)||''}catch{}if(!stored){try{stored=sessionStorage.getItem(DRIVE_NONCE_KEY)||''}catch{}}try{localStorage.removeItem(DRIVE_NONCE_KEY)}catch{}try{sessionStorage.removeItem(DRIVE_NONCE_KEY)}catch{}const record=safeJsonParse(stored),expected=record?.n||stored||'',rememberedId=String(record?.c||'').trim();try{history.replaceState(null,'',location.pathname+location.search)}catch{}if(!token||!stateParam||stateParam!==expected)return null;if(rememberedId){saveDriveConfig({clientId:rememberedId});try{if(state&&state.settings)state.settings.googleClientId=rememberedId}catch{}}const saved={token,exp:Date.now()+Math.max(60,expires-120)*1000};saveStoredDriveToken(saved);return saved}
function localHasMeaningfulData(){return state.transactions.some(t=>!t.deletedAt)||(state.pendingReview||[]).length||state.budgets.length||state.goals.length||state.recurring.length||state.scheduled.length||state.merchantRules.length||state.accounts.length!==1||state.accounts.some(a=>a.id!=='acc-main'||a.name!=='Main account'||Number(a.openingBalance)!==0||a.archived)}
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function deviceId(){let id=null;try{id=localStorage.getItem(DEVICE_KEY)}catch{return uid('device')}if(!id){id=uid('device');try{localStorage.setItem(DEVICE_KEY,id)}catch{}}return id}
function isLiability(account){return account&&ACCOUNT_TYPES[account.type]&&!ACCOUNT_TYPES[account.type].asset}
function categoryById(id){return state.categories.find(c=>c.id===id)||{id:'unknown',name:'Uncategorized',type:'expense',color:'#64748b',icon:'circle'} }
function accountById(id){return state.accounts.find(a=>a.id===id)||null}
function getCategoryOptions(type,selected=''){return state.categories.filter(c=>c.type===type&&(!c.archived||c.id===selected)).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.name)}${c.archived?' (archived)':''}</option>`).join('')}
function getAccountOptions(selected='',includeLiabilities=true){return state.accounts.filter(a=>(!a.archived||a.id===selected)&&(includeLiabilities||!isLiability(a))).sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${escapeHtml(a.name)}${a.archived?' (archived)':''}</option>`).join('')}

function emptyData(){const now=Date.now();return {
  schemaVersion:SCHEMA_VERSION,
  meta:{createdAt:now,updatedAt:now,deviceId:deviceId(),revision:1,lastBackupAt:0,lastMigrationAt:0},
  settings:{theme:'dark',currency:'EUR',startView:'dashboard',aiEndpoint:'',aiEnabled:false,googleClientId:'',weekStartsMonday:true},
  accounts:[{id:'acc-main',name:'Main account',type:'checking',currency:'EUR',openingBalance:0,openingDate:today(),color:'#2563eb',archived:false,createdAt:now,updatedAt:now}],
  categories:deepClone(DEFAULT_CATEGORIES),transactions:[],pendingReview:[],budgets:[],goals:[],debts:[],recurring:[],scheduled:[],merchantRules:[],importBatches:[],reports:[]
}}
function legacyCategoryId(name,type){const n=normalizeText(name);const found=DEFAULT_CATEGORIES.find(c=>c.type===type&&normalizeText(c.name)===n);return found?found.id:(type==='income'?'cat-other-income':'cat-other-expense')}
function migrateLegacy(raw){const base=emptyData();const now=Date.now();const currency=raw?.settings?.currency&&CURRENCIES[raw.settings.currency]?raw.settings.currency:'EUR';base.settings.theme=raw?.settings?.theme==='light'?'light':'dark';base.settings.currency=currency;base.accounts[0].currency=currency;base.accounts[0].name='Legacy account';
  base.transactions=(Array.isArray(raw?.transactions)?raw.transactions:[]).map(t=>{
    const type=t.type==='income'?'income':'expense';const amount=Math.abs(minorFromInput(t.amount,currency));
    if(!Number.isFinite(amount)||amount<=0||!validDate(t.date))return null;
    return {id:String(t.id||uid('tx')),type,amount,currency,date:t.date,accountId:'acc-main',categoryId:legacyCategoryId(t.category,type),merchant:String(t.notes||'').slice(0,140),notes:'',paymentMethod:String(t.paymentMethod||''),status:'cleared',excluded:false,recurringId:t.recurringId||null,createdAt:Number(t.createdAt)||now,updatedAt:now,source:'legacy'}
  }).filter(Boolean);
  const oldBudgets=raw?.budgets&&typeof raw.budgets==='object'?raw.budgets:{};
  base.budgets=Object.entries(oldBudgets).map(([name,value])=>({id:uid('budget'),month:currentMonth(),categoryId:legacyCategoryId(name,'expense'),amount:Math.abs(minorFromInput(value,currency)),rollover:false,createdAt:now,updatedAt:now})).filter(b=>b.amount>0);
  base.recurring=(Array.isArray(raw?.recurring)?raw.recurring:[]).map(r=>({id:String(r.id||uid('rec')),name:String(r.name||'Recurring item'),type:r.type==='income'?'income':'expense',amount:Math.abs(minorFromInput(r.amount,currency)),currency,accountId:'acc-main',categoryId:legacyCategoryId(r.category,r.type==='income'?'income':'expense'),frequency:'monthly',day:clamp(Number(r.day)||1,1,31),startDate:today(),nextDate:nextRecurringDate(clamp(Number(r.day)||1,1,31)),paymentMethod:String(r.paymentMethod||''),active:true,autoPost:false,lastGeneratedMonth:r.lastPosted||null,createdAt:Number(r.createdAt)||now,updatedAt:now})).filter(r=>r.amount>0);
  base.pendingReview=(Array.isArray(raw?.inbox)?raw.inbox:[]).map(x=>{const type=x.type==='income'?'income':x.type==='expense'?'expense':null,amount=Math.abs(minorFromInput(x.amount,currency)),date=validDate(x.date)?x.date:null;if(!type||!Number.isFinite(amount)||amount<=0||!date)return null;return{id:String(x.id||uid('review')),type,amount,currency,date,accountId:'acc-main',suggestedCategoryId:legacyCategoryId(x.suggestion?.category||x.category,type),merchant:String(x.merchant||x.notes||'').slice(0,140),paymentMethod:String(x.paymentMethod||''),confidence:x.suggestion?.confidence||'low',source:'legacy-inbox',createdAt:Number(x.createdAt)||now,updatedAt:now}}).filter(Boolean);
  base.meta.migrationWarnings={invalidLegacyInbox:(Array.isArray(raw?.inbox)?raw.inbox.length:0)-base.pendingReview.length};
  base.meta.lastMigrationAt=now;base.meta.updatedAt=now;
  return base;
}
function sanitizeData(raw){const b=emptyData();if(!raw||typeof raw!=='object')return b;const out={...b,...raw,settings:{...b.settings,...(raw.settings||{})},meta:{...b.meta,...(raw.meta||{})}};out.schemaVersion=SCHEMA_VERSION;
  for(const key of ['accounts','categories','transactions','pendingReview','budgets','goals','debts','recurring','scheduled','merchantRules','importBatches','reports'])if(!Array.isArray(out[key]))out[key]=[];
  if(!out.accounts.length)out.accounts=b.accounts;if(!out.categories.length)out.categories=deepClone(DEFAULT_CATEGORIES);
  out.transactions=out.transactions.filter(t=>t&&['income','expense','transfer'].includes(t.type)&&Number.isFinite(Number(t.amount))&&Number(t.amount)>0&&validDate(t.date));
  return out;
}
let bootIssue=null;
function loadData(){let raw=null,stored=null;try{stored=localStorage.getItem(APP_KEY);raw=safeJsonParse(stored)}catch{}if(stored&&!raw){bootIssue={type:'corrupt',message:'The current local data could not be parsed. Tally quarantined the raw value instead of deleting it.',raw:stored};try{localStorage.setItem(`tally:quarantined:${Date.now()}`,stored)}catch{}return emptyData()}if(raw){if(Number(raw.schemaVersion||0)>SCHEMA_VERSION){bootIssue={type:'newer',message:`This data uses schema version ${raw.schemaVersion}, which is newer than this app can safely open. The original record has not been modified.`,raw:stored};return emptyData()}return sanitizeData(raw)}let legacy=null;try{legacy=safeJsonParse(localStorage.getItem(LEGACY_KEY))}catch{}if(legacy){try{localStorage.setItem('tally:legacy-backup:v1',JSON.stringify(legacy))}catch{}const migrated=migrateLegacy(legacy);try{localStorage.setItem(APP_KEY,JSON.stringify(migrated))}catch{}return migrated}return emptyData()}

let saveTimer=null,driveSyncTimer=null,driveSyncQueued=false;
function saveState({snapshot=false,reason='Change',skipDrive=false}={}){state.meta.updatedAt=Date.now();state.meta.revision=(state.meta.revision||0)+1;state.meta.deviceId=deviceId();ui.dirty=true;if(snapshot)createSnapshot(reason);clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(APP_KEY,JSON.stringify(state));ui.dirty=false;updateStorageStatus();if(!skipDrive)scheduleDriveSync()}catch(e){toast('Storage is full or unavailable. Export a backup now.','error')}},80)}
function createSnapshot(reason){try{let arr=safeJsonParse(localStorage.getItem(BACKUP_KEY))||[];arr.unshift({id:uid('snap'),reason,createdAt:Date.now(),data:deepClone(state)});arr=arr.slice(0,3);localStorage.setItem(BACKUP_KEY,JSON.stringify(arr));state.meta.lastBackupAt=Date.now()}catch{}}
function restoreSnapshot(id){const arr=safeJsonParse(localStorage.getItem(BACKUP_KEY))||[];const s=arr.find(x=>x.id===id);if(!s)return;createSnapshot('Before local restore');state=applyLocalDriveConfig(sanitizeData(s.data));bootIssue=null;saveState();closeModal();render();toast('Local snapshot restored')}
function getSnapshots(){try{return safeJsonParse(localStorage.getItem(BACKUP_KEY))||[]}catch{return[]}}

function accountBalance(accountId,untilDate=today()){const a=accountById(accountId);if(!a)return 0;let bal=a.openingDate&&a.openingDate>untilDate?0:(Number(a.openingBalance)||0);for(const t of state.transactions){if(t.deletedAt||t.status==='void'||t.date>untilDate)continue;const amount=Number(t.amount)||0;if(t.type==='income'&&t.accountId===accountId)bal+=amount;else if(t.type==='expense'&&t.accountId===accountId)bal-=amount;else if(t.type==='transfer'){if(t.fromAccountId===accountId)bal-=amount;if(t.toAccountId===accountId)bal+=amount}}
  return bal;
}
function allBalances(){return state.accounts.filter(a=>!a.archived).map(a=>({...a,balance:accountBalance(a.id)}))}
function netWorth(){return sum(allBalances(),a=>a.balance)}
function liquidCash(){return sum(allBalances().filter(a=>['checking','savings','cash'].includes(a.type)),a=>a.balance)}
function txInMonth(m){const cutoff=today();return state.transactions.filter(t=>!t.deletedAt&&t.status!=='void'&&t.date<=cutoff&&t.date.slice(0,7)===m)}
function monthTotals(m){const tx=txInMonth(m),reported=tx.filter(t=>!t.excluded);const income=sum(reported.filter(t=>t.type==='income'),t=>t.amount);const expense=sum(reported.filter(t=>t.type==='expense'),t=>t.amount);return{income,expense,net:income-expense,count:reported.length}}
function categoryTotals(m,type='expense'){const map=new Map;for(const t of txInMonth(m)){if(t.type!==type||t.excluded)continue;map.set(t.categoryId,(map.get(t.categoryId)||0)+t.amount)}return [...map.entries()].map(([categoryId,amount])=>({categoryId,amount,category:categoryById(categoryId)})).sort((a,b)=>b.amount-a.amount)}
function budgetFor(categoryId,m){return state.budgets.find(b=>b.categoryId===categoryId&&b.month===m)||null}
function effectiveBudgetLimit(categoryId,m,depth=0){const b=budgetFor(categoryId,m);if(!b)return 0;let limit=Number(b.amount)||0;if(b.rollover&&depth<24){const prev=monthShift(m,-1),prevBudget=budgetFor(categoryId,prev);if(prevBudget){const prevLimit=effectiveBudgetLimit(categoryId,prev,depth+1),prevSpent=categoryTotals(prev,'expense').find(x=>x.categoryId===categoryId)?.amount||0;limit+=Math.max(0,prevLimit-prevSpent)}}return limit}
function budgetSummary(m){const budgets=state.budgets.filter(b=>b.month===m),spent=categoryTotals(m,'expense');const rows=budgets.map(b=>{const s=spent.find(x=>x.categoryId===b.categoryId)?.amount||0,limit=effectiveBudgetLimit(b.categoryId,m);return{...b,baseAmount:b.amount,amount:limit,rolloverAmount:Math.max(0,limit-b.amount),spent:s,pct:limit?Math.round(s/limit*100):0,category:categoryById(b.categoryId)}});return{rows,totalBudget:sum(rows,b=>b.amount),totalSpent:sum(rows,b=>b.spent)}}
function daysInMonth(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function monthProgress(m){if(m!==currentMonth())return m<currentMonth()?1:0;return new Date().getDate()/daysInMonth(m)}
function recurringDateForMonth(day,m){const [y,mo]=m.split('-').map(Number);const d=Math.min(day,new Date(y,mo,0).getDate());return `${m}-${String(d).padStart(2,'0')}`}
function nextRecurringDate(day,from=today()){let m=from.slice(0,7),date=recurringDateForMonth(day,m);if(date<from){m=monthShift(m,1);date=recurringDateForMonth(day,m)}return date}
function advanceRecurringDate(rule,date){if(rule.frequency==='weekly'){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)}const nextM=monthShift(date.slice(0,7),1);return recurringDateForMonth(rule.day||1,nextM)}
function nextScheduledDateForRule(ruleId){return state.scheduled.filter(s=>s.recurringId===ruleId&&s.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date))[0]?.date||null}
function generateScheduled(){let changed=false;const floor=currentMonth()+'-01',hm=monthShift(currentMonth(),2),horizon=`${hm}-${String(daysInMonth(hm)).padStart(2,'0')}`;for(const r of state.recurring.filter(x=>x.active)){let cursor=r.nextDate||nextRecurringDate(r.day||1,r.startDate||today()),skip=0;while(cursor<floor&&skip++<5000)cursor=advanceRecurringDate(r,cursor);let guard=0;while(cursor<=horizon&&guard++<100){if(!state.scheduled.some(s=>s.recurringId===r.id&&s.date===cursor)){state.scheduled.push({id:uid('sch'),recurringId:r.id,name:r.name,type:r.type,amount:r.amount,currency:r.currency,accountId:r.accountId,fromAccountId:r.fromAccountId||null,toAccountId:r.toAccountId||null,categoryId:r.categoryId||null,date:cursor,status:'scheduled',createdAt:Date.now(),updatedAt:Date.now()});changed=true}cursor=advanceRecurringDate(r,cursor)}}if(changed)saveState()}

function transactionFingerprint(t){return [t.type,t.date,t.accountId||'',t.fromAccountId||'',t.toAccountId||'',t.amount,normalizeText(t.merchant||t.notes||'')].join('|')}
function findLikelyDuplicate(t){const fp=transactionFingerprint(t);return state.transactions.find(x=>!x.deletedAt&&transactionFingerprint(x)===fp)}
function periodDates(kind){const end=today();const d=new Date(end+'T12:00:00');let start;if(kind==='week'){const day=d.getDay()||7;d.setDate(d.getDate()-day+1);start=d.toISOString().slice(0,10)}else if(kind==='year'){start=end.slice(0,4)+'-01-01'}else start=end.slice(0,7)+'-01';return{start,end}}
function totalsBetween(start,end){const tx=state.transactions.filter(t=>!t.deletedAt&&t.status!=='void'&&t.date>=start&&t.date<=end&&!t.excluded);const income=sum(tx.filter(t=>t.type==='income'),t=>t.amount),expense=sum(tx.filter(t=>t.type==='expense'),t=>t.amount);return{tx,income,expense,net:income-expense}}

</div>`}
function renderPendingReview(){const items=state.pendingReview||[];if(!items.length)return'';return `<div class="card pad" style="border-color:color-mix(in srgb,var(--warn) 45%,var(--line))"><div class="card-head"><div><h2>${items.length} item${items.length===1?' needs':'s need'} review</h2><p>Migrated pending activity is kept outside balances until you confirm it.</p></div><button class="btn outline sm" onclick="acceptAllReviewItems()">Accept all suggestions</button></div><div class="account-list">${items.slice(0,5).map(x=>{const cat=categoryById(x.suggestedCategoryId);return `<div class="account-row"><div class="category-icon" style="color:${cat.color};background:${cat.color}18">${icon(cat.icon)}</div><div class="account-main"><div class="row-title">${escapeHtml(x.merchant||'Pending transaction')}</div><div class="row-sub">${new Date(x.date+'T12:00:00').toLocaleDateString()} · suggested ${escapeHtml(cat.name)}${x.confidence?` · ${escapeHtml(x.confidence)} confidence`:''}</div></div><div class="row-value ${x.type==='income'?'up':'down'}">${x.type==='income'?'+':'−'}${money(x.amount,x.currency)}</div><button class="btn outline sm" onclick="openReviewItemModal('${x.id}')">Review</button></div>`}).join('')}</div>${items.length>5?`<p class="help" style="margin:10px 2px 0">Showing 5 of ${items.length}. Confirm items to reveal the rest.</p>`:''}</div>`}
function openReviewItemModal(id){const x=state.pendingReview.find(v=>v.id===id);if(!x)return;openModal({title:'Review pending transaction',body:`<form id="review-form" class="form-grid" onsubmit="saveReviewItem(event,'${id}')"><div class="field"><label for="review-amount">Amount</label><input id="review-amount" class="input" inputmode="decimal" value="${majorFromMinor(x.amount,x.currency)}" required autofocus></div><div class="field"><label for="review-date">Date</label><input id="review-date" class="input" type="date" value="${x.date}" required></div><div class="field"><label for="review-account">Account</label><select id="review-account" class="select">${getAccountOptions(x.accountId||'')}</select></div><div class="field"><label for="review-category">Category</label><select id="review-category" class="select">${getCategoryOptions(x.type,x.suggestedCategoryId)}</select></div><div class="field full"><label for="review-merchant">Description or merchant</label><input id="review-merchant" class="input" value="${escapeHtml(x.merchant||'')}" maxlength="140"></div></form>`,footer:`<button class="btn ghost left down" onclick="discardReviewItem('${id}')">Discard</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('review-form').requestSubmit()">Confirm transaction</button>`})}
function saveReviewItem(e,id){e.preventDefault();const x=state.pendingReview.find(v=>v.id===id);if(!x)return;const amount=Math.abs(minorFromInput(document.getElementById('review-amount').value,x.currency)),date=document.getElementById('review-date').value;if(!Number.isFinite(amount)||amount<=0||!validDate(date)){toast('Check the amount and date','error');return}confirmReviewItem(x,{amount,date,accountId:document.getElementById('review-account').value,categoryId:document.getElementById('review-category').value,merchant:document.getElementById('review-merchant').value.trim().slice(0,140)})}
function confirmReviewItem(x,overrides={}){state.transactions.push({id:uid('tx'),type:x.type,amount:overrides.amount??x.amount,currency:x.currency||state.settings.currency,date:overrides.date||x.date,accountId:overrides.accountId||x.accountId||state.accounts.find(a=>!a.archived)?.id,categoryId:overrides.categoryId||x.suggestedCategoryId,merchant:overrides.merchant??x.merchant,notes:'Confirmed from pending review',excluded:false,status:'cleared',source:x.source||'review',createdAt:Date.now(),updatedAt:Date.now()});state.pendingReview=state.pendingReview.filter(v=>v.id!==x.id);saveState();closeModal();render();toast('Pending transaction confirmed')}
function acceptAllReviewItems(){if(!state.pendingReview.length)return;openConfirm({title:'Accept all suggested categories?',body:`This will add ${state.pendingReview.length} pending items to the ledger using their suggested categories and accounts.`,confirm:'Accept all',onConfirm:()=>{createSnapshot('Before accepting pending review items');const items=[...state.pendingReview];for(const x of items){state.transactions.push({id:uid('tx'),type:x.type,amount:x.amount,currency:x.currency||state.settings.currency,date:x.date,accountId:x.accountId||state.accounts.find(a=>!a.archived)?.id,categoryId:x.suggestedCategoryId,merchant:x.merchant,notes:'Confirmed from pending review',excluded:false,status:'cleared',source:x.source||'review',createdAt:Date.now(),updatedAt:Date.now()})}state.pendingReview=[];saveState();closeModal();render();toast(`${items.length} pending items confirmed`)}})}
function discardReviewItem(id){const x=state.pendingReview.find(v=>v.id===id);if(!x)return;openConfirm({title:'Discard pending item?',body:`${escapeHtml(x.merchant||'Pending transaction')} · ${money(x.amount,x.currency)}. The original legacy backup remains available.`,confirm:'Discard',danger:true,onConfirm:()=>{createSnapshot('Before discarding pending item');state.pendingReview=state.pendingReview.filter(v=>v.id!==id);saveState();closeModal();render();toast('Pending item discarded')}})}

function renderWelcome(){return `<div class="card empty"><div class="empty-icon">${icon('wallet')}</div><h3>Build a complete picture of your money</h3><p>Add your real accounts and opening balances, then record or import activity. Existing Tally data is migrated automatically when this file replaces the old app at the same location.</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="openAccountModal()">${icon('plus')} Add account</button><button class="btn outline" onclick="loadSampleData()">Load sample data</button></div></div>`}
function kpi(label,value,sub,tone='neutral'){return `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value ${tone==='up'?'up':tone==='down'?'down':''}">${value}</div><div class="kpi-sub ${tone}">${sub}</div></div>`}

function calendarMonthEntries(m){const tx=state.transactions.filter(t=>!t.deletedAt&&t.status!=='void'&&t.date.slice(0,7)===m&&t.type!=='transfer').map(t=>({id:t.id,kind:'transaction',type:t.type,amount:t.amount,currency:t.currency||state.settings.currency,date:t.date,name:t.merchant||categoryById(t.categoryId).name,notes:t.notes||'',categoryId:t.categoryId||null,scheduled:false}));const scheduled=state.scheduled.filter(s=>s.status==='scheduled'&&s.date.slice(0,7)===m).map(s=>({id:s.id,kind:'scheduled',type:s.type,amount:s.amount,currency:s.currency||state.settings.currency,date:s.date,name:s.name||'Scheduled item',notes:'Upcoming scheduled activity',categoryId:s.categoryId||null,scheduled:true}));return [...tx,...scheduled].sort((a,b)=>a.date.localeCompare(b.date)||(a.type||'').localeCompare(b.type||''))}
function calendarEntryColor(entry){if(entry.type==='income')return 'var(--accent)';if(entry.type==='transfer')return 'var(--info)';return categoryById(entry.categoryId).color||'var(--warn)'}
function dashboardCalendarDayForMonth(m){if(validDate(ui.dashboardDay)&&ui.dashboardDay.slice(0,7)===m)return ui.dashboardDay;return today().slice(0,7)===m?today():`${m}-01`}
function setDashboardDay(date){if(!validDate(date))return;ui.dashboardDay=date;render()}
function renderCalendarAgendaRow(entry){const meta=entry.type==='transfer'?{name:'Transfer',icon:'transfer',color:'var(--info)'}:entry.type==='income'?{name:'Income',icon:'salary',color:'var(--accent)'}:categoryById(entry.categoryId);const sign=entry.type==='income'?'+':entry.type==='expense'?'−':'';const note=entry.scheduled?'Scheduled future activity':(entry.notes||meta.name||'Recorded activity');return `<div class="calendar-agenda-item"><div class="category-icon" style="color:${meta.color};background:color-mix(in srgb,${meta.color} 18%,var(--panel2))">${icon(meta.icon||'circle')}</div><div class="account-main"><div class="row-title">${escapeHtml(entry.name||meta.name||'Activity')}${entry.scheduled?'<span class="calendar-badge">Scheduled</span>':''}</div><div class="row-sub">${escapeHtml(note)}</div></div><div class="row-value ${entry.type==='income'?'up':entry.type==='expense'?'down':''}">${sign}${money(entry.amount,entry.currency)}</div></div>`}
function renderDashboardCalendar(){const m=ui.month;const entries=calendarMonthEntries(m);const selected=dashboardCalendarDayForMonth(m);const dayMap=new Map;for(const item of entries){const arr=dayMap.get(item.date)||[];arr.push(item);dayMap.set(item.date,arr)}const [y,mo]=m.split('-').map(Number),days=daysInMonth(m),first=new Date(y,mo-1,1),startIndex=state.settings.weekStartsMonday?((first.getDay()+6)%7):first.getDay();const labels=state.settings.weekStartsMonday?['Mo','Tu','We','Th','Fr','Sa','Su']:['Su','Mo','Tu','We','Th','Fr','Sa'];const totalCells=Math.ceil((startIndex+days)/7)*7;let cells='';for(let i=0;i<totalCells;i++){if(i<startIndex||i>=startIndex+days){cells+='<div class="calendar-empty"></div>';continue}const day=i-startIndex+1,date=`${m}-${String(day).padStart(2,'0')}`,list=dayMap.get(date)||[],colors=[...new Set(list.map(calendarEntryColor))].slice(0,4);cells+=`<button class="calendar-day ${date===selected?'selected':''} ${date===today()?'today':''}" onclick="setDashboardDay('${date}')" aria-label="Open ${date}"><span class="calendar-date">${day}</span><span class="calendar-dots">${colors.map(color=>`<i style="background:${color}"></i>`).join('')}</span></button>`}const selectedEntries=(dayMap.get(selected)||[]).sort((a,b)=>{if(a.scheduled!==b.scheduled)return a.scheduled?1:-1;return (b.amount||0)-(a.amount||0)});const futureExpenseTotal=sum(entries.filter(x=>x.scheduled&&x.type==='expense'&&x.date>=today()),x=>x.amount);const selectedLabel=selected===today()?'Today':new Date(selected+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});return `<div class="card pad calendar-card"><div class="card-head"><div><h2>Calendar</h2><p class="calendar-headline">Upcoming charges this month: <strong>${money(futureExpenseTotal)}</strong></p></div><button class="btn outline sm" onclick="setView('planning')">${icon('calendar')} Subscriptions</button></div><div class="calendar-weekdays">${labels.map(label=>`<span>${label}</span>`).join('')}</div><div class="calendar-grid">${cells}</div><div class="calendar-agenda"><h3>${escapeHtml(selectedLabel)}</h3>${selectedEntries.length?`<div class="calendar-agenda-list">${selectedEntries.map(renderCalendarAgendaRow).join('')}</div>`:'<p class="help">Nothing on this day.</p>'}</div></div>`}
function renderSpendDonut(){const raw=categoryTotals(ui.month,'expense').filter(x=>x.amount>0);if(!raw.length)return `<div class="card pad"><div class="card-head"><div><h2>Where it went</h2><p>${monthLabel(ui.month)}</p></div></div><div class="empty" style="padding:28px 8px"><p>No expenses recorded for this month yet.</p></div></div>`;const top=raw.slice(0,5).map(x=>({...x,category:x.category||categoryById(x.categoryId)}));if(raw.length>5){top.push({categoryId:'other-expenses',amount:sum(raw.slice(5),x=>x.amount),category:{name:'Other',color:'#64748b',icon:'circle'}})}const total=sum(top,x=>x.amount),r=54,c=2*Math.PI*r;let offset=0;const arcs=top.map((row,idx)=>{const portion=Math.max(0,row.amount/total),dash=Math.max(0,portion*c);const stroke=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${row.category.color}" stroke-width="22" stroke-dasharray="${dash} ${Math.max(c-dash,0)}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"/>`;offset+=dash;return stroke}).join('');return `<div class="card pad"><div class="card-head"><div><h2>Where it went</h2><p>${monthLabel(ui.month)}</p></div></div><div class="spend-layout"><div class="spend-ring-box"><svg viewBox="0 0 180 180" role="img" aria-label="Expense breakdown by category"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--panel3)" stroke-width="22"/>${arcs}</svg><div class="spend-center"><div><strong>${money(total)}</strong><span>spent</span></div></div></div><div class="spend-legend">${top.map(row=>{const pct=Math.round(row.amount/total*100);return `<div class="spend-legend-row"><div class="spend-legend-name"><i style="background:${row.category.color}"></i><span>${escapeHtml(row.category.name)}</span></div><div class="spend-legend-value">${money(row.amount)}</div><div class="spend-legend-pct">${pct}%</div></div>`}).join('')}</div></div></div>`}

function renderDashboardAlert(cur,b,pct,pace){let type='info',title='Your month is on track',body='Keep recording transactions to improve projections.';if(cur.net<0){type='danger';title='Spending exceeds income';body=`Net cash flow is ${money(cur.net)} for ${monthLabel(ui.month)}.`}else if(b.totalBudget&&pct>pace*100+15){type='warning';title='Spending is ahead of the calendar';body=`You have used ${pct}% of budget while ${Math.round(pace*100)}% of the month has elapsed.`}else if(cur.income&&cur.net>0){type='info';title=`You have kept ${Math.round(cur.net/cur.income*100)}% of income`;body=`Net cash flow is ${money(cur.net)} so far this month.`}return `<div class="notice ${type}">${icon(type==='danger'?'alert':type==='warning'?'alert':'shield')}<div><strong>${title}</strong><p>${body}</p></div></div>`}
function renderCashflowChart(months=6){const list=[];let m=currentMonth();for(let i=0;i<months;i++){list.unshift({month:m,...monthTotals(m)});m=monthShift(m,-1)}const max=Math.max(1,...list.flatMap(x=>[x.income,x.expense]));const w=700,h=220,pad={l:45,r:12,t:14,b:28};const x=i=>pad.l+i*(w-pad.l-pad.r)/(list.length-1||1),y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);const path=k=>list.map((d,i)=>`${i?'L':'M'} ${x(i)} ${y(d[k])}`).join(' ');let grids='';for(let i=0;i<4;i++){const yy=pad.t+i*(h-pad.t-pad.b)/3;grids+=`<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" class="chart-grid"/><text x="0" y="${yy+4}" class="chart-axis">${compactMoney(max*(1-i/3))}</text>`}const labels=list.map((d,i)=>`<text x="${x(i)}" y="${h-5}" text-anchor="middle" class="chart-axis">${monthLabel(d.month,{month:'short'})}</text>`).join('');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Six month income and expense chart">${grids}${labels}<path d="${path('income')}" class="chart-income"/><path d="${path('expense')}" class="chart-expense"/>${list.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.income)}" r="3" fill="var(--accent)"/><circle cx="${x(i)}" cy="${y(d.expense)}" r="3" fill="var(--danger)"/>`).join('')}</svg></div>`}
function renderCategoryBars(rows,limit=10){if(!rows.length)return `<div class="empty" style="padding:30px 8px"><p>No expense activity for this period.</p></div>`;const max=rows[0].amount||1;return rows.slice(0,limit).map(r=>`<div class="category-bar"><div class="category-bar-name">${escapeHtml(r.category.name)}</div><div class="bar"><span style="width:${Math.round(r.amount/max*100)}%;background:${r.category.color}"></span></div><div class="category-bar-value">${money(r.amount)}</div></div>`).join('')}
function renderScheduledRow(s){const transfer=s.type==='transfer',cat=transfer?{color:'#6366f1',icon:'transfer',name:'Transfer'}:categoryById(s.categoryId);const detail=transfer?`${escapeHtml(accountById(s.fromAccountId)?.name||'Unknown')} → ${escapeHtml(accountById(s.toAccountId)?.name||'Unknown')}`:new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});const amount=transfer?money(s.amount):`${s.type==='transfer'?'↔':s.type==='income'?'+':'−'}${money(s.amount)}`;return `<div class="account-row" style="padding:10px;border:0;border-bottom:1px solid var(--line);border-radius:0"><div class="category-icon" style="color:${cat.color};background:${cat.color}18">${icon(cat.icon)}</div><div class="account-main"><div class="row-title">${escapeHtml(s.name)}</div><div class="row-sub">${detail}${transfer?` · ${new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}`:''}</div></div><div class="row-value ${s.type==='income'?'up':s.type==='expense'?'down':''}">${amount}</div><button class="icon-btn" style="width:34px;min-height:34px" onclick="openScheduledActions('${s.id}')" aria-label="Review scheduled item">${icon('more')}</button></div>`}

function filteredTransactions(){let tx=state.transactions.filter(t=>!t.deletedAt&&t.status!=='void');const f=ui.transactionFilter;if(f.q){const q=normalizeText(f.q);tx=tx.filter(t=>normalizeText(`${t.merchant} ${t.notes} ${categoryById(t.categoryId).name} ${accountById(t.accountId)?.name||''} ${accountById(t.fromAccountId)?.name||''} ${accountById(t.toAccountId)?.name||''}`).includes(q))}if(f.type!=='all')tx=tx.filter(t=>t.type===f.type);if(f.account!=='all')tx=tx.filter(t=>t.accountId===f.account||t.fromAccountId===f.account||t.toAccountId===f.account);if(f.category!=='all')tx=tx.filter(t=>t.categoryId===f.category);if(f.month!=='all')tx=tx.filter(t=>t.date.slice(0,7)===f.month);return tx.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0))}

function renderTransactions(){const tx=filteredTransactions(),shown=tx.slice(0,ui.txLimit);const total=sum(tx.filter(t=>t.type==='income'),t=>t.amount)-sum(tx.filter(t=>t.type==='expense'),t=>t.amount);const months=[...new Set(state.transactions.filter(t=>!t.deletedAt).map(t=>t.date.slice(0,7)))].sort().reverse();return `<div class="stack">
  <div class="card pad"><div class="toolbar"><div class="search">${icon('search')}<input class="input" aria-label="Search transactions" placeholder="Search merchant, note, category or account" value="${escapeHtml(ui.transactionFilter.q)}" oninput="setTxFilter('q',this.value)"></div><select class="select" aria-label="Filter type" onchange="setTxFilter('type',this.value)" style="width:auto"><option value="all">All types</option><option value="income" ${ui.transactionFilter.type==='income'?'selected':''}>Income</option><option value="expense" ${ui.transactionFilter.type==='expense'?'selected':''}>Expenses</option><option value="transfer" ${ui.transactionFilter.type==='transfer'?'selected':''}>Transfers</option></select><select class="select" aria-label="Filter account" onchange="setTxFilter('account',this.value)" style="width:auto"><option value="all">All accounts</option>${getAccountOptions(ui.transactionFilter.account)}</select><select class="select" aria-label="Filter month" onchange="setTxFilter('month',this.value)" style="width:auto"><option value="all">All months</option>${months.map(m=>`<option value="${m}" ${ui.transactionFilter.month===m?'selected':''}>${monthLabel(m,{month:'short',year:'numeric'})}</option>`).join('')}</select><button class="btn outline" onclick="openImportModal()">${icon('upload')} Import</button><button class="btn primary" onclick="openTransactionModal()">${icon('plus')} Add</button></div></div>
  <div class="grid three">${kpi('Filtered activity',`${tx.length} transaction${tx.length===1?'':'s'}`,'Current filters')}${kpi('Net movement',money(total),total>=0?'Positive filtered cash flow':'Negative filtered cash flow',total>=0?'up':'down')}${kpi('Excluded',String(tx.filter(t=>t.excluded).length),'Excluded from reports and budgets')}</div>
  <div class="card">${tx.length?`<div class="table-wrap">${renderTransactionTable(shown,false)}</div>${tx.length>shown.length?`<div style="padding:14px;text-align:center;border-top:1px solid var(--line)"><button class="btn outline" onclick="loadMoreTransactions()">Show ${Math.min(100,tx.length-shown.length)} more</button><div class="help" style="margin-top:6px">Showing ${shown.length} of ${tx.length}</div></div>`:''}`:`<div class="empty"><div class="empty-icon">${icon('search')}</div><h3>No matching transactions</h3><p>Change the filters or add a new transaction.</p><button class="btn primary" onclick="openTransactionModal()">Add transaction</button></div>`}</div>
</div>`}
function setTxFilter(k,v){ui.transactionFilter[k]=v;ui.txLimit=100;render()}
function loadMoreTransactions(){ui.txLimit+=100;render()}
function renderTransactionTable(tx,compact=false){return `<table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th class="num">Amount</th>${compact?'':'<th aria-label="Actions"></th>'}</tr></thead><tbody>${tx.map(t=>{const cat=t.type==='transfer'?{name:'Transfer',color:'#6366f1'}:categoryById(t.categoryId);const acc=t.type==='transfer'?`${accountById(t.fromAccountId)?.name||'Unknown'} → ${accountById(t.toAccountId)?.name||'Unknown'}`:accountById(t.accountId)?.name||'Unknown';const sign=t.type==='income'?'+':t.type==='expense'?'−':'';return `<tr><td>${new Date(t.date+'T12:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}</td><td><div class="merchant">${escapeHtml(t.merchant||t.notes||(t.type==='transfer'?'Account transfer':cat.name))}</div><div class="subline">${t.excluded?'Excluded · ':''}${escapeHtml(t.notes||'')}</div></td><td><span class="pill"><i class="dot" style="background:${cat.color}"></i>${escapeHtml(cat.name)}</span></td><td>${escapeHtml(acc)}</td><td class="num ${t.type==='income'?'up':t.type==='expense'?'down':''}">${sign}${money(t.amount,t.currency||state.settings.currency)}</td>${compact?'':`<td class="num"><button class="icon-btn" style="width:32px;min-height:32px" onclick="openTransactionModal('${t.id}')" aria-label="Edit transaction">${icon('edit')}</button><button class="icon-btn" style="width:32px;min-height:32px" onclick="confirmDeleteTransaction('${t.id}')" aria-label="Delete transaction">${icon('trash')}</button></td>`}</tr>`}).join('')}</tbody></table>`}

function renderAccounts(){const balances=allBalances(),archived=state.accounts.filter(a=>a.archived).map(a=>({...a,balance:accountBalance(a.id)}));return `<div class="stack">
  <div class="grid kpis">${kpi('Net worth',money(netWorth()),'Assets minus liabilities',netWorth()>=0?'up':'down')}${kpi('Liquid cash',money(liquidCash()),'Available cash and savings')}${kpi('Assets',money(sum(balances.filter(a=>a.balance>0),a=>a.balance)),'Positive account balances','up')}${kpi('Liabilities',money(Math.abs(sum(balances.filter(a=>a.balance<0),a=>a.balance))),'Cards and amounts owed','down')}${kpi('Accounts',String(balances.length),'Active accounts')}</div>
  <div class="card pad"><div class="card-head"><div><h2>Your accounts</h2><p>Opening balances plus cleared ledger activity</p></div><button class="btn primary" onclick="openAccountModal()">${icon('plus')} Add account</button></div>${balances.length?`<div class="account-list">${balances.map(a=>renderAccountRow(a)).join('')}</div>`:`<div class="empty"><p>No active accounts.</p></div>`}</div>
