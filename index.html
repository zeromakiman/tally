</div>`}

function renderAccountRow(a){const meta=ACCOUNT_TYPES[a.type]||ACCOUNT_TYPES.other;const count=state.transactions.filter(t=>!t.deletedAt&&(t.accountId===a.id||t.fromAccountId===a.id||t.toAccountId===a.id)).length;return `<div class="account-row"><div class="account-icon" style="color:${a.color||meta.color};background:${(a.color||meta.color)}18">${icon(meta.icon)}</div><div class="account-main"><div class="row-title">${escapeHtml(a.name)}</div><div class="row-sub">${a.archived?'Archived · ':''}${meta.label} · ${count} transaction${count===1?'':'s'} · opened ${new Date(a.openingDate+'T12:00:00').toLocaleDateString()}</div></div><div class="row-value ${a.balance<0?'down':a.balance>0?'up':''}">${money(a.balance,a.currency)}</div><button class="icon-btn" onclick="openReconcileModal('${a.id}')" aria-label="Reconcile ${escapeHtml(a.name)}" title="Reconcile balance">${icon('check')}</button><button class="icon-btn" onclick="openAccountModal('${a.id}')" aria-label="Edit ${escapeHtml(a.name)}">${icon('edit')}</button></div>`}

function renderBudgets(){const m=ui.month,s=budgetSummary(m),expenseCats=state.categories.filter(c=>c.type==='expense'&&!c.archived);const map=new Map(s.rows.map(r=>[r.categoryId,r]));return `<div class="stack"><div class="toolbar" style="justify-content:center">${monthPicker()}</div>
  <div class="grid three">${kpi('Budgeted',money(s.totalBudget),`${s.rows.length} categor${s.rows.length===1?'y':'ies'}`)}${kpi('Spent',money(s.totalSpent),s.totalBudget?`${Math.round(s.totalSpent/s.totalBudget*100)}% of total budget`:'No monthly limits',s.totalBudget&&s.totalSpent>s.totalBudget?'down':'neutral')}${kpi('Remaining',money(s.totalBudget-s.totalSpent),s.totalBudget-s.totalSpent>=0?'Available across budgets':'Combined overspend',s.totalBudget-s.totalSpent>=0?'up':'down')}</div>
  <div class="card pad"><div class="card-head"><div><h2>${monthLabel(m)} category budgets</h2><p>Each month is stored separately, so future edits never rewrite past performance.</p></div><button class="btn outline" onclick="copyPreviousBudgets()">Copy previous month</button></div><div class="budget-list">${expenseCats.map(c=>{const r=map.get(c.id);const pct=r?.amount?Math.round(r.spent/r.amount*100):0;return `<div class="budget-row"><div class="category-icon" style="color:${c.color};background:${c.color}18">${icon(c.icon)}</div><div class="budget-main"><div style="display:flex;justify-content:space-between;gap:12px"><div class="row-title">${escapeHtml(c.name)}</div><div class="row-sub">${r?`${money(r.spent)} of ${money(r.amount)}${r.rolloverAmount?` · ${money(r.rolloverAmount)} rollover`:''}`:'No limit'}</div></div>${r?`<div class="progress ${pct>=100?'danger':pct>=80?'warn':''}" style="margin-top:8px"><span style="width:${clamp(pct,0,100)}%"></span></div>`:'<div class="row-sub" style="margin-top:7px">Spent '+money(categoryTotals(m,'expense').find(x=>x.categoryId===c.id)?.amount||0)+'</div>'}</div><div class="row-value ${pct>=100?'down':pct>=80?'warn':''}">${r?pct+'%':'—'}</div><button class="icon-btn" onclick="openBudgetModal('${c.id}')" aria-label="Set ${escapeHtml(c.name)} budget">${icon(r?'edit':'plus')}</button></div>`}).join('')}</div></div></div>`}
function copyPreviousBudgets(){const from=monthShift(ui.month,-1),previous=state.budgets.filter(b=>b.month===from);if(!previous.length){toast('No budgets found in the previous month','warn');return}openConfirm({title:'Copy previous budgets?',body:`This will replace ${monthLabel(ui.month)} budgets with ${previous.length} limits from ${monthLabel(from)}.`,confirm:'Copy budgets',onConfirm:()=>{createSnapshot('Before copying budgets');state.budgets=state.budgets.filter(b=>b.month!==ui.month);state.budgets.push(...previous.map(b=>({...b,id:uid('budget'),month:ui.month,createdAt:Date.now(),updatedAt:Date.now()})));saveState();closeModal();render();toast('Budgets copied')}})}

function renderPlanning(){const goals=state.goals.filter(g=>!g.archived),archivedGoals=state.goals.filter(g=>g.archived),debts=state.accounts.filter(a=>!a.archived&&isLiability(a)).map(a=>({...a,balance:accountBalance(a.id)})),recurring=[...state.recurring].sort((a,b)=>(nextScheduledDateForRule(a.id)||a.nextDate||'').localeCompare(nextScheduledDateForRule(b.id)||b.nextDate||''));return `<div class="stack">
  <div class="grid two"><div class="card pad"><div class="card-head"><div><h2>Savings goals</h2><p>Target amounts linked to real account balances or manual progress</p></div><button class="btn primary sm" onclick="openGoalModal()">${icon('plus')} Add goal</button></div>${goals.length?`<div class="goal-list">${goals.map(renderGoalRow).join('')}</div>`:`<div class="empty" style="padding:34px 10px"><div class="empty-icon">${icon('target')}</div><p>Create an emergency fund, holiday or deposit goal.</p><button class="btn outline sm" onclick="openGoalModal()">Create goal</button></div>`}${archivedGoals.length?`<div style="margin-top:16px"><h3 class="section-title" style="margin-bottom:9px">Archived goals</h3><div class="goal-list">${archivedGoals.map(renderGoalRow).join('')}</div></div>`:''}</div>
  <div class="card pad"><div class="card-head"><div><h2>Debt overview</h2><p>Liability account balances and payoff context</p></div><button class="btn outline sm" onclick="openAccountModal(null,'credit')">${icon('plus')} Add debt</button></div>${debts.length?debts.map(renderDebtRow).join(''):`<div class="empty" style="padding:34px 10px"><p>No credit cards or loan accounts.</p></div>`}</div></div>
  <div class="card pad"><div class="card-head"><div><h2>Recurring activity</h2><p>Scheduled first, confirmed only when the money actually moves</p></div><button class="btn primary sm" onclick="openRecurringModal()">${icon('plus')} Add recurring</button></div>${recurring.length?`<div class="account-list">${recurring.map(renderRecurringRow).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('calendar')}</div><p>Add salary, rent, subscriptions or regular transfers.</p></div>`}</div>
</div>`}

function renderGoalRow(g){const linked=g.accountId?accountBalance(g.accountId):Number(g.currentAmount)||0,pct=g.targetAmount?Math.round(linked/g.targetAmount*100):0;return `<div class="goal-row" style="${g.archived?'opacity:.7':''}"><div class="category-icon" style="color:${g.color||'#10b981'};background:${g.color||'#10b981'}18">${icon('target')}</div><div class="goal-main"><div style="display:flex;justify-content:space-between;gap:10px"><div class="row-title">${escapeHtml(g.name)}</div><div class="row-sub">${money(linked)} of ${money(g.targetAmount)}</div></div><div class="progress" style="margin-top:8px"><span style="width:${clamp(pct,0,100)}%"></span></div><div class="row-sub">${g.archived?'Archived · ':''}${g.targetDate?`Target ${new Date(g.targetDate+'T12:00:00').toLocaleDateString()}`:'No target date'}${g.accountId?` · linked to ${escapeHtml(accountById(g.accountId)?.name||'account')}`:''}</div></div><div class="row-value">${pct}%</div><button class="icon-btn" onclick="${g.archived?`restoreGoal('${g.id}')`:`openGoalModal('${g.id}')`}" aria-label="${g.archived?'Restore':'Edit'} goal">${icon(g.archived?'check':'edit')}</button></div>`}

function renderDebtRow(a){const owed=Math.max(0,-a.balance);const rate=Number(a.interestRate)||0,min=Number(a.minimumPayment)||0;let payoff='Add rate and payment details in account settings';if(owed&&min){const monthly=rate/1200;if(monthly===0)payoff=`About ${Math.ceil(owed/min)} months at the current payment`;else if(min<=owed*monthly)payoff='Minimum payment does not cover monthly interest';else{const months=Math.ceil(-Math.log(1-monthly*owed/min)/Math.log(1+monthly));payoff=`About ${months} months at ${money(min)}/month`}}return `<div class="account-row" style="margin-bottom:9px"><div class="account-icon" style="color:${a.color||'#f43f5e'};background:${a.color||'#f43f5e'}18">${icon(ACCOUNT_TYPES[a.type]?.icon||'loan')}</div><div class="account-main"><div class="row-title">${escapeHtml(a.name)}</div><div class="row-sub">${rate?rate+'% APR · ':''}${payoff}</div></div><div class="row-value down">${money(owed)}</div><button class="icon-btn" onclick="openAccountModal('${a.id}')" aria-label="Edit ${escapeHtml(a.name)} debt account">${icon('edit')}</button></div>`}
function renderRecurringRow(r){const transfer=r.type==='transfer',cat=transfer?{color:'#6366f1',icon:'transfer'}:categoryById(r.categoryId);const accountText=transfer?`${escapeHtml(accountById(r.fromAccountId)?.name||'Unknown')} → ${escapeHtml(accountById(r.toAccountId)?.name||'Unknown')}`:escapeHtml(accountById(r.accountId)?.name||'Unknown');return `<div class="account-row" style="${r.active?'':'opacity:.65'}"><div class="category-icon" style="color:${cat.color};background:${cat.color}18">${icon(cat.icon)}</div><div class="account-main"><div class="row-title">${escapeHtml(r.name)}</div><div class="row-sub">${r.active?'':'Paused · '}${r.frequency==='weekly'?'Weekly':`Monthly on day ${r.day}`} · ${accountText} · next ${new Date((nextScheduledDateForRule(r.id)||r.nextDate||nextRecurringDate(r.day))+'T12:00:00').toLocaleDateString()}</div></div><div class="row-value ${r.type==='income'?'up':r.type==='expense'?'down':''}">${transfer?'↔':r.type==='income'?'+':'−'}${money(r.amount)}</div><button class="icon-btn" onclick="openRecurringModal('${r.id}')" aria-label="Edit recurring item ${escapeHtml(r.name)}">${icon('edit')}</button></div>`}

function reportData(kind=ui.reportPeriod){const {start,end}=periodDates(kind),cur=totalsBetween(start,end);let prevStart,prevEnd;if(kind==='week'){const s=new Date(start+'T12:00:00'),e=new Date(end+'T12:00:00');s.setDate(s.getDate()-7);e.setDate(e.getDate()-7);prevStart=s.toISOString().slice(0,10);prevEnd=e.toISOString().slice(0,10)}else if(kind==='year'){const y=Number(start.slice(0,4))-1;prevStart=`${y}-01-01`;prevEnd=`${y}-12-31`}else{const pm=monthShift(start.slice(0,7),-1);prevStart=pm+'-01';prevEnd=pm+'-'+String(daysInMonth(pm)).padStart(2,'0')}const prev=totalsBetween(prevStart,prevEnd);const catMap=new Map;for(const t of cur.tx.filter(t=>t.type==='expense'))catMap.set(t.categoryId,(catMap.get(t.categoryId)||0)+t.amount);const categories=[...catMap.entries()].map(([id,amount])=>({category:categoryById(id),amount})).sort((a,b)=>b.amount-a.amount);const amounts=cur.tx.filter(t=>t.type==='expense').map(t=>t.amount),med=median(amounts);const unusual=cur.tx.filter(t=>t.type==='expense'&&amounts.length>=4&&t.amount>Math.max(med*2.5,minorFromInput(100,state.settings.currency))).sort((a,b)=>b.amount-a.amount).slice(0,5);const budget=kind==='month'?budgetSummary(start.slice(0,7)):null;return{kind,start,end,cur,prev,categories,unusual,budget}}
function renderReports(){const r=reportData();const actions=buildReportActions(r);return `<div class="stack"><div class="toolbar" style="justify-content:center"><div class="segment"><button class="${ui.reportPeriod==='week'?'active':''}" onclick="setReportPeriod('week')">This week</button><button class="${ui.reportPeriod==='month'?'active':''}" onclick="setReportPeriod('month')">This month</button><button class="${ui.reportPeriod==='year'?'active':''}" onclick="setReportPeriod('year')">This year</button></div></div>
  <article class="report"><div class="report-hero"><div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start"><div><h2>${reportTitle(r)}</h2><p>${new Date(r.start+'T12:00:00').toLocaleDateString()} – ${new Date(r.end+'T12:00:00').toLocaleDateString()}</p></div><div class="card-actions"><button class="btn outline sm" onclick="downloadCurrentReport()">${icon('download')} Export</button>${state.settings.aiEnabled&&state.settings.aiEndpoint?`<button class="btn primary sm" onclick="requestAIReport()">AI analysis</button>`:''}</div></div></div>
    <div class="report-section"><div class="metric-row"><div class="metric"><span>Income</span><strong class="up">${money(r.cur.income)}</strong></div><div class="metric"><span>Expenses</span><strong class="down">${money(r.cur.expense)}</strong></div><div class="metric"><span>Net cash flow</span><strong class="${r.cur.net>=0?'up':'down'}">${money(r.cur.net)}</strong></div><div class="metric"><span>Savings rate</span><strong>${r.cur.income?Math.round(r.cur.net/r.cur.income*100)+'%':'—'}</strong></div></div></div>
    <div class="report-section"><h3>What changed</h3><ul>${reportChanges(r).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="report-section"><h3>Spending concentration</h3>${renderCategoryBars(r.categories,5)}</div>
    <div class="report-section"><h3>Potential concerns</h3>${r.unusual.length?`<ul>${r.unusual.map(t=>`<li>${escapeHtml(t.merchant||categoryById(t.categoryId).name)} was ${money(t.amount)} on ${new Date(t.date+'T12:00:00').toLocaleDateString()}.</li>`).join('')}</ul>`:`<p class="help">No unusually large expenses were detected from the available activity.</p>`}</div>
    <div class="report-section"><h3>Recommended actions</h3><ul>${actions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </article>
  <div class="notice info">${icon('shield')}<div><strong>Numbers are calculated locally, not by AI</strong><p>The optional AI endpoint receives only a sanitized summary after you enable it. Tally never stores an AI provider key in this HTML file.</p></div></div>
</div>`}
function setReportPeriod(p){ui.reportPeriod=p;render()}
function reportTitle(r){return r.kind==='week'?'Your weekly financial report':r.kind==='year'?'Your annual financial report':'Your monthly financial report'}
function reportChanges(r){const out=[];const ep=pctChange(r.cur.expense,r.prev.expense),ip=pctChange(r.cur.income,r.prev.income);if(ip!==null)out.push(`Income was ${Math.abs(Math.round(ip))}% ${ip>=0?'higher':'lower'} than the previous comparable period.`);else out.push('There is not enough previous income data for a reliable comparison.');if(ep!==null)out.push(`Expenses were ${Math.abs(Math.round(ep))}% ${ep>=0?'higher':'lower'} than the previous comparable period.`);else out.push('There is not enough previous expense data for a reliable comparison.');if(r.categories[0])out.push(`${escapeHtml(r.categories[0].category.name)} was the largest expense category at ${money(r.categories[0].amount)}.`);if(r.budget?.totalBudget){const p=Math.round(r.budget.totalSpent/r.budget.totalBudget*100);out.push(`You used ${p}% of the month’s combined category budgets.`)}return out}
function buildReportActions(r){const out=[];if(r.cur.net<0)out.push(`Reduce discretionary spending or increase income by at least ${money(Math.abs(r.cur.net))} to bring this period back to break-even.`);else if(r.cur.income&&r.cur.net/r.cur.income<.2)out.push(`A 20% savings rate would require keeping ${money(Math.max(0,Math.round(r.cur.income*.2-r.cur.net)))} more from similar income.`);else out.push('Continue directing positive cash flow toward your highest-priority goal or liability.');if(r.categories[0]&&r.cur.expense)out.push(`Review ${escapeHtml(r.categories[0].category.name)}, which represents ${Math.round(r.categories[0].amount/r.cur.expense*100)}% of expenses.`);if(r.unusual[0])out.push(`Confirm that the ${money(r.unusual[0].amount)} ${escapeHtml(r.unusual[0].merchant||'transaction')} charge is expected and correctly categorized.`);if(r.budget?.rows.some(x=>x.pct>=90))out.push('Adjust at least one category that has reached 90% of its monthly budget.');return out.slice(0,3)}
function reportPayload(){const r=reportData();return{period:{type:r.kind,start:r.start,end:r.end},currency:state.settings.currency,summary:{income:r.cur.income,expense:r.cur.expense,net:r.cur.net,savingsRate:r.cur.income?Math.round(r.cur.net/r.cur.income*100):null},previous:{income:r.prev.income,expense:r.prev.expense,net:r.prev.net},categories:r.categories.slice(0,10).map(x=>({name:x.category.name,amount:x.amount})),unusual:r.unusual.map(t=>({date:t.date,amount:t.amount,category:categoryById(t.categoryId).name,merchant:(t.merchant||'').slice(0,60)}),),budgets:r.budget?{total:r.budget.totalBudget,spent:r.budget.totalSpent,nearLimit:r.budget.rows.filter(x=>x.pct>=80).map(x=>({category:x.category.name,pct:x.pct}))}:null,goals:state.goals.filter(g=>!g.archived).map(g=>({name:g.name,target:g.targetAmount,current:g.accountId?accountBalance(g.accountId):g.currentAmount||0,targetDate:g.targetDate||null}))}}

function renderSettings(){return `<div class="card pad"><div class="tabs">${[['general','General'],['categories','Categories'],['data','Data & backups'],['sync','Google Drive'],['ai','AI & privacy'],['danger','Danger zone']].map(([id,label])=>`<button class="${ui.settingsTab===id?'active':''}" onclick="setSettingsTab('${id}')">${label}</button>`).join('')}</div>${renderSettingsTab()}</div>`}
function setSettingsTab(t){ui.settingsTab=t;render()}
function renderSettingsTab(){if(ui.settingsTab==='categories')return renderCategorySettings();if(ui.settingsTab==='data')return renderDataSettings();if(ui.settingsTab==='sync')return renderSyncSettings();if(ui.settingsTab==='ai')return renderAISettings();if(ui.settingsTab==='danger')return renderDangerSettings();return renderGeneralSettings()}
function renderGeneralSettings(){return `<div class="stack"><div><h2 class="section-title">Appearance</h2><p class="help">Theme changes apply immediately and preserve readable contrast.</p></div><div class="form-grid"><div class="field"><label for="setting-theme">Theme</label><select id="setting-theme" class="select" onchange="changeSetting('theme',this.value)"><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option><option value="system" ${state.settings.theme==='system'?'selected':''}>System</option></select></div><div class="field"><label for="setting-currency">Display currency</label><select id="setting-currency" class="select" onchange="changeBaseCurrency(this.value)">${Object.keys(CURRENCIES).map(c=>`<option value="${c}" ${state.settings.currency===c?'selected':''}>${c} — ${CURRENCIES[c].symbol.trim()}</option>`).join('')}</select><div class="help">This is a single-currency ledger. Changing it relabels existing values; amounts are not converted.</div></div></div><div class="notice info">${icon('shield')}<div><strong>Local-first by default</strong><p>Records stay in this browser unless you explicitly export, sync to your Google Drive app folder, or enable an AI endpoint.</p></div></div></div>`}
function renderCategorySettings(){const archived=state.categories.filter(c=>c.archived);return `<div class="stack"><div class="card-head"><div><h2>Categories</h2><p>Create and archive categories without breaking old transactions.</p></div><button class="btn primary sm" onclick="openCategoryModal()">${icon('plus')} Add category</button></div><div class="grid two">${['expense','income'].map(type=>`<div><h3 class="section-title" style="margin-bottom:10px">${type==='expense'?'Expense':'Income'} categories</h3><div class="account-list">${state.categories.filter(c=>c.type===type&&!c.archived).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>renderCategorySettingRow(c)).join('')}</div></div>`).join('')}</div>${archived.length?`<div><h3 class="section-title" style="margin-bottom:10px">Archived categories</h3><div class="account-list">${archived.map(c=>renderCategorySettingRow(c)).join('')}</div></div>`:''}<div class="notice info">${icon('spark')}<div style="flex:1"><strong>${state.merchantRules.length} learned merchant rule${state.merchantRules.length===1?'':'s'}</strong><p>Rules are created only when you choose “Remember this merchant’s category.” They stay on this device and are included in backups.</p></div>${state.merchantRules.length?`<button class="btn ghost sm" onclick="confirmClearMerchantRules()">Clear rules</button>`:''}</div></div>`}
function renderCategorySettingRow(c){return `<div class="account-row" style="${c.archived?'opacity:.7':''}"><div class="category-icon" style="color:${c.color};background:${c.color}18">${icon(c.icon)}</div><div class="account-main"><div class="row-title">${escapeHtml(c.name)}</div><div class="row-sub">${c.archived?'Archived · ':''}${c.type==='expense'?'Expense':'Income'}</div></div><button class="icon-btn" onclick="${c.archived?`restoreCategory('${c.id}')`:`openCategoryModal('${c.id}')`}" aria-label="${c.archived?'Restore':'Edit'} category ${escapeHtml(c.name)}">${icon(c.archived?'check':'edit')}</button></div>`}

function renderDataSettings(){const snaps=getSnapshots();return `<div class="stack"><div><h2 class="section-title">Export and restore</h2><p class="help">Backups include every account, transaction, monthly budget, pending review item, goal, recurring rule, custom category and setting.</p></div><div class="grid two"><button class="btn outline wide" onclick="exportBackup()">${icon('download')} Download full backup</button><button class="btn outline wide" onclick="openEncryptedBackupModal()">${icon('shield')} Encrypted backup</button><button class="btn outline wide" onclick="exportCSV()">${icon('download')} Export transaction CSV</button><button class="btn outline wide" onclick="document.getElementById('restore-input').click()">${icon('upload')} Restore backup</button></div><input id="restore-input" type="file" accept=".json,application/json" class="hidden" onchange="readRestoreFile(this.files[0]);this.value=''">${bootIssue?`<div class="notice danger"><div style="flex:1"><strong>Quarantined local record</strong><p>Download the raw record for support or restore one of the local snapshots below. Tally will not delete the original storage entry automatically.</p></div><button class="btn outline sm" onclick="downloadQuarantinedData()">Download raw data</button></div>`:''}
  <div><h2 class="section-title">Local recovery snapshots</h2><p class="help">Tally keeps up to three local snapshots before destructive or structural changes.</p></div>${snaps.length?`<div class="account-list">${snaps.map(s=>`<div class="account-row"><div class="account-icon">${icon('shield')}</div><div class="account-main"><div class="row-title">${escapeHtml(s.reason)}</div><div class="row-sub">${new Date(s.createdAt).toLocaleString()}</div></div><button class="btn outline sm" onclick="confirmRestoreSnapshot('${s.id}')">Restore</button></div>`).join('')}</div>`:`<div class="notice info">${icon('shield')}<div><strong>No recovery snapshots yet</strong><p>A snapshot will be created before imports, restores, sample data, bulk changes and deletion.</p></div></div>`}</div>`}
function renderSyncSettings(){const fileProtocol=location.protocol==='file:',cfg=loadDriveConfig();return `<div class="stack"><div><h2 class="section-title">Google Drive synchronization</h2><p class="help">Tally uses the same private <strong>${DRIVE_SYNC_NAME}</strong> file on every device. It searches for the file by name, compares update times, and synchronizes the newer copy.</p></div>${fileProtocol?`<div class="notice warning">${icon('alert')}<div><strong>Host this HTML on HTTPS to use Google sign-in</strong><p>Google OAuth does not support sign-in from a local file URL. GitHub Pages or Cloudflare Pages are sufficient.</p></div></div>`:''}<div id="drive-sync-status" class="notice info"></div><div class="field"><label for="google-client">Google OAuth Client ID</label><input id="google-client" class="input" value="${escapeHtml(state.settings.googleClientId||cfg.clientId||'')}" placeholder="1234567890-xxxx.apps.googleusercontent.com" oninput="rememberClientId(this.value)" onblur="changeSetting('googleClientId',this.value.trim())"><div class="help">Enter it once on a new device. The app remembers it locally and also keeps it in the synchronized Tally settings.</div></div><label class="notice info" style="cursor:pointer"><input type="checkbox" ${cfg.autoSync?'checked':''} onchange="toggleDriveAutoSync(this.checked)" style="margin-top:3px"><div><strong>Automatically synchronize changes</strong><p>After connecting, Tally checks Drive on startup and uploads local changes after a short delay.</p></div></label><div class="toolbar"><button class="btn primary" onclick="driveConnect()" ${fileProtocol?'disabled':''}>${icon('cloud')} ${ui.driveConnected?'Sync now':'Connect Google Drive'}</button><button class="btn outline" onclick="driveForcePull()" ${fileProtocol?'disabled':''}>Force download</button><button class="btn outline" onclick="driveForcePush()" ${fileProtocol?'disabled':''}>Force upload</button><button class="btn ghost" onclick="driveDisconnect()" ${fileProtocol?'disabled':''}>Disconnect</button></div><div class="notice info">${icon('shield')}<div><strong>Safe first connection</strong><p>A fresh phone pulls the existing cloud copy instead of replacing it with an empty local database. A local recovery snapshot is made before cloud data replaces this device.</p></div></div></div>`}
function renderAISettings(){return `<div class="stack"><div><h2 class="section-title">Optional AI financial assistant</h2><p class="help">Tally performs all calculations locally. An AI service may explain a sanitized summary but never receives account numbers, OAuth tokens or provider keys.</p></div><label class="notice info" style="cursor:pointer"><input type="checkbox" ${state.settings.aiEnabled?'checked':''} onchange="changeSetting('aiEnabled',this.checked)" style="margin-top:3px"><div><strong>Enable external AI reports</strong><p>Only the current report summary, category totals, budget status and goal progress are sent after you press AI analysis.</p></div></label><div class="field"><label for="ai-endpoint">Your secure serverless endpoint</label><input id="ai-endpoint" class="input" value="${escapeHtml(state.settings.aiEndpoint||'')}" placeholder="https://your-worker.example.com/report" onblur="changeSetting('aiEndpoint',this.value.trim())"><div class="help">Do not paste an OpenAI API key here. The endpoint must store the key securely on the server.</div></div><div class="notice warning">${icon('alert')}<div><strong>Financial guidance limitations</strong><p>AI output can be incorrect. It should explain verified data and suggest questions or actions, not make autonomous transfers, trades or regulated investment decisions.</p></div></div></div>`}
function renderDangerSettings(){const counts=`${state.accounts.length} accounts, ${state.transactions.filter(t=>!t.deletedAt).length} transactions, ${(state.pendingReview||[]).length} pending review items, ${state.budgets.length} budgets, ${state.goals.length} goals, ${state.recurring.length} recurring rules and ${state.scheduled.length} scheduled items`;return `<div class="stack"><div class="notice danger">${icon('alert')}<div><strong>Clear all application data</strong><p>This removes ${counts}. Your original legacy backup key remains untouched unless you manually clear browser storage.</p></div></div><button class="btn danger" onclick="confirmClearAll()">${icon('trash')} Clear all Tally v2 data</button></div>`}
function changeBaseCurrency(v){if(!CURRENCIES[v]||v===state.settings.currency)return;const apply=()=>{createSnapshot('Before base currency change');state.settings.currency=v;for(const a of state.accounts)a.currency=v;for(const t of state.transactions)t.currency=v;for(const r of state.recurring)r.currency=v;for(const x of state.scheduled)x.currency=v;saveState();closeModal();render();toast('Base currency relabelled — values were not converted')};if(state.transactions.some(t=>!t.deletedAt)||state.accounts.some(a=>a.openingBalance)){openConfirm({title:'Relabel the entire ledger currency?',body:`All accounts and transactions will display as ${v}. Numeric values will not be converted. A recovery snapshot will be created first.`,confirm:'Relabel currency',onConfirm:apply})}else apply()}
function changeSetting(k,v){state.settings[k]=v;if(k==='googleClientId')saveDriveConfig({clientId:String(v||'').trim()});saveState({skipDrive:k==='googleClientId'});if(k==='theme'||k==='currency')render();else toast('Setting saved')}
function toggleDriveAutoSync(enabled){saveDriveConfig({autoSync:!!enabled});if(enabled&&ui.driveToken)scheduleDriveSync();render();toast(enabled?'Automatic Drive sync enabled':'Automatic Drive sync paused')}
let lastFocus=null;
function openModal({title,body,footer='',wide=false,onOpen=null}){lastFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop open" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${escapeHtml(title)}</h2><button class="icon-btn" onclick="closeModal()" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</section></div>`;document.body.style.overflow='hidden';const modal=document.querySelector('.modal');modal?.addEventListener('keydown',trapFocus);setTimeout(()=>{const el=modal?.querySelector('[autofocus],input,select,textarea,button');el?.focus();onOpen?.()},0)}
function closeModal(restoreFocus=true){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';const focusTarget=lastFocus;lastFocus=null;if(restoreFocus)focusTarget?.focus?.()}
function trapFocus(e){if(e.key==='Escape'){closeModal();return}if(e.key!=='Tab')return;const els=[...e.currentTarget.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-backdrop.open'))closeModal()})
function openConfirm({title,body,confirm='Confirm',danger=false,typed='',onConfirm}){openModal({title,body:`<p style="font-size:13px;line-height:1.6;margin:0;color:var(--muted)">${body}</p>${typed?`<div class="field" style="margin-top:14px"><label for="confirm-text">Type ${escapeHtml(typed)} to continue</label><input id="confirm-text" class="input" autocomplete="off" oninput="document.getElementById('confirm-action').disabled=this.value!=='${escapeHtml(typed)}'"></div>`:''}`,footer:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button id="confirm-action" class="btn ${danger?'danger':'primary'}" ${typed?'disabled':''}>${confirm}</button>`,onOpen:()=>{document.getElementById('confirm-action').onclick=onConfirm}})}
function toast(msg,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toast-root').appendChild(el);setTimeout(()=>el.remove(),3500)}
function updateStorageStatus(){const el=document.getElementById('storage-status');if(!el)return;let ok=true;try{localStorage.setItem('__tally_probe','1');localStorage.removeItem('__tally_probe')}catch{ok=false}const cloud=ui.driveSyncing?' · Syncing to Drive…':ui.driveConnected?' · Drive connected':'';el.innerHTML=ok?`<span class="sync-dot ${ui.dirty||ui.driveSyncing?'warn':''}"></span>${ui.dirty?'Saving changes…':'Saved locally on this device'}${cloud}`:`<span class="sync-dot warn"></span>Session only — storage unavailable`}
function updateDriveStatus(){const el=document.getElementById('drive-sync-status');if(!el)return;const cfg=loadDriveConfig(),last=ui.driveLastSyncAt?new Date(ui.driveLastSyncAt).toLocaleString():'Not synced yet';let cls='info',ic='cloud',title='Ready to connect',detail='Tally will search Google Drive for the shared '+DRIVE_SYNC_NAME+' file. Connect Google to synchronize this device.';if(ui.driveSyncing){title='Synchronizing with Google Drive';detail='Please keep this page open until the current update finishes.'}else if(ui.driveConnected){title='Automatic Drive sync connected';detail=`Last successful sync: ${last}. This device is using the shared ${DRIVE_SYNC_NAME} file.`}else if(!cfg.clientId){cls='warning';ic='alert';title='Google OAuth Client ID required';detail='Paste it once. Tally stores it separately from your finance backups so restores cannot delete it.'}el.className=`notice ${cls}`;el.innerHTML=`${icon(ic)}<div><strong>${title}</strong><p>${detail}</p></div>`}
function applyTheme(){let t=state.settings.theme;if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#09090b':'#f6f7f8'}
function toggleTheme(){const current=document.documentElement.dataset.theme;state.settings.theme=current==='dark'?'light':'dark';saveState();render()}

function openTransactionModal(id=null,prefill={}){ui.pendingScheduledId=prefill.scheduledId||null;const existing=id?state.transactions.find(t=>t.id===id):null;const type=existing?.type||prefill.type||'expense';const currency=existing?.currency||state.settings.currency;const acc=existing?.accountId||prefill.accountId||state.accounts.find(a=>!a.archived)?.id||'';const from=existing?.fromAccountId||prefill.fromAccountId||state.accounts.find(a=>!a.archived&&!isLiability(a))?.id||acc;const to=existing?.toAccountId||prefill.toAccountId||state.accounts.find(a=>!a.archived&&a.id!==from)?.id||'';const amount=existing?majorFromMinor(existing.amount,currency):(prefill.amount??'');openModal({title:existing?'Edit transaction':'Add transaction',wide:true,body:`
  <form id="tx-form" class="stack" onsubmit="saveTransaction(event,'${id||''}')">
    <div class="segment" role="tablist"><button type="button" data-t="expense" class="${type==='expense'?'active':''}" onclick="setTxFormType('expense')">Expense</button><button type="button" data-t="income" class="${type==='income'?'active':''}" onclick="setTxFormType('income')">Income</button><button type="button" data-t="transfer" class="${type==='transfer'?'active':''}" onclick="setTxFormType('transfer')">Transfer</button></div>
    <input type="hidden" id="tx-type" value="${type}">
    <div class="form-grid"><div class="field"><label for="tx-amount">Amount</label><input id="tx-amount" class="input" inputmode="decimal" required autofocus value="${amount}" placeholder="0.00"></div><div class="field"><label for="tx-date">Date</label><input id="tx-date" class="input" type="date" required value="${existing?.date||prefill.date||today()}"></div>
      <div id="tx-normal-fields" class="full form-grid ${type==='transfer'?'hidden':''}"><div class="field"><label for="tx-account">Account</label><select id="tx-account" class="select">${getAccountOptions(acc)}</select></div><div class="field"><label for="tx-category">Category</label><select id="tx-category" class="select">${getCategoryOptions(type==='income'?'income':'expense',existing?.categoryId||prefill.categoryId||'')}</select></div></div>
      <div id="tx-transfer-fields" class="full form-grid ${type==='transfer'?'':'hidden'}"><div class="field"><label for="tx-from">From account</label><select id="tx-from" class="select">${getAccountOptions(from)}</select></div><div class="field"><label for="tx-to">To account</label><select id="tx-to" class="select">${getAccountOptions(to)}</select></div></div>
      <div class="field full"><label for="tx-merchant">Description or merchant</label><input id="tx-merchant" class="input" maxlength="140" value="${escapeHtml(existing?.merchant||prefill.merchant||'')}" placeholder="e.g. Mercadona, Salary, Savings transfer"></div><div class="field full"><label for="tx-notes">Notes</label><textarea id="tx-notes" class="textarea" maxlength="500" placeholder="Optional context">${escapeHtml(existing?.notes||'')}</textarea></div>
      <label class="notice info full" style="cursor:pointer"><input id="tx-excluded" type="checkbox" ${existing?.excluded?'checked':''} style="margin-top:3px"><div><strong>Exclude from reports and budgets</strong><p>Useful for reimbursements, balance corrections or non-personal activity.</p></div></label><label id="tx-remember-wrap" class="notice info full ${type==='transfer'?'hidden':''}" style="cursor:pointer"><input id="tx-remember" type="checkbox" ${existing?'':'checked'} style="margin-top:3px"><div><strong>Remember this merchant’s category</strong><p>Future imports with the same normalized merchant name can be categorized automatically.</p></div></label>
    </div>
  </form>`,footer:`${existing?`<button class="btn ghost left down" onclick="confirmDeleteTransaction('${id}')">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('tx-form').requestSubmit()">${existing?'Save changes':'Add transaction'}</button>`})}
function setTxFormType(type){document.getElementById('tx-type').value=type;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===type));document.getElementById('tx-normal-fields').classList.toggle('hidden',type==='transfer');document.getElementById('tx-transfer-fields').classList.toggle('hidden',type!=='transfer');document.getElementById('tx-remember-wrap')?.classList.toggle('hidden',type==='transfer');if(type!=='transfer'){document.getElementById('tx-category').innerHTML=getCategoryOptions(type,document.getElementById('tx-category').value)}}
function saveTransaction(e,id){e.preventDefault();const type=document.getElementById('tx-type').value,currency=state.settings.currency,amount=Math.abs(minorFromInput(document.getElementById('tx-amount').value,currency)),date=document.getElementById('tx-date').value;if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid amount','error');return}if(!validDate(date)){toast('Enter a valid date','error');return}const now=Date.now();let tx={id:id||uid('tx'),type,amount,currency,date,merchant:document.getElementById('tx-merchant').value.trim().slice(0,140),notes:document.getElementById('tx-notes').value.trim().slice(0,500),excluded:document.getElementById('tx-excluded').checked,status:'cleared',updatedAt:now};if(type==='transfer'){tx.fromAccountId=document.getElementById('tx-from').value;tx.toAccountId=document.getElementById('tx-to').value;if(!tx.fromAccountId||!tx.toAccountId||tx.fromAccountId===tx.toAccountId){toast('Choose two different accounts','error');return}}else{tx.accountId=document.getElementById('tx-account').value;tx.categoryId=document.getElementById('tx-category').value;tx.rememberMerchant=!!document.getElementById('tx-remember')?.checked;if(!tx.accountId||!tx.categoryId){toast('Choose an account and category','error');return}}
  const old=id?state.transactions.find(t=>t.id===id):null;tx.createdAt=old?.createdAt||now;tx.source=old?.source||'manual';const duplicate=!id&&findLikelyDuplicate(tx);if(duplicate){openConfirm({title:'Possible duplicate',body:'An identical transaction already exists. Add this one anyway?',confirm:'Add anyway',onConfirm:()=>commitTransaction(tx,id)});return}commitTransaction(tx,id)}
function commitTransaction(tx,id){if(tx.type!=='transfer'&&tx.rememberMerchant&&normalizeText(tx.merchant).length>=3){const merchant=normalizeText(tx.merchant),rule=state.merchantRules.find(r=>r.type===tx.type&&r.merchant===merchant);if(rule){rule.categoryId=tx.categoryId;rule.updatedAt=Date.now()}else state.merchantRules.push({id:uid('rule'),merchant,type:tx.type,categoryId:tx.categoryId,createdAt:Date.now(),updatedAt:Date.now()})}delete tx.rememberMerchant;if(id){const i=state.transactions.findIndex(t=>t.id===id);if(i>=0)state.transactions[i]=tx}else state.transactions.push(tx);if(ui.pendingScheduledId){const scheduled=state.scheduled.find(s=>s.id===ui.pendingScheduledId);if(scheduled){scheduled.status='confirmed';scheduled.updatedAt=Date.now();tx.scheduledId=scheduled.id;tx.recurringId=scheduled.recurringId||null}ui.pendingScheduledId=null}saveState();closeModal();render();toast(id?'Transaction updated':'Transaction added')}
function confirmDeleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;openConfirm({title:'Delete transaction?',body:`${escapeHtml(t.merchant||'Transaction')} · ${money(t.amount)} on ${new Date(t.date+'T12:00:00').toLocaleDateString()}. A recovery snapshot will be created.`,confirm:'Delete',danger:true,onConfirm:()=>{createSnapshot('Before deleting transaction');t.deletedAt=Date.now();t.updatedAt=Date.now();saveState();closeModal();render();toast('Transaction deleted')}})}

function openAccountModal(id=null,preset='checking'){const a=id?accountById(id):null;const type=a?.type||preset;const displayOpening=a?(isLiability(a)?Math.abs(majorFromMinor(a.openingBalance,a.currency)):majorFromMinor(a.openingBalance,a.currency)):'';openModal({title:a?'Edit account':'Add account',body:`<form id="account-form" class="form-grid" onsubmit="return saveAccount(event,'${id||''}')"><div class="field full"><label for="acc-name">Account name</label><input id="acc-name" class="input" required autofocus maxlength="60" value="${escapeHtml(a?.name||'')}" placeholder="e.g. CaixaBank, Cash wallet, Visa"></div><div class="field"><label for="acc-type">Account type</label><select id="acc-type" class="select" onchange="accountTypeHelp()">${Object.entries(ACCOUNT_TYPES).map(([k,v])=>`<option value="${k}" ${type===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label for="acc-currency">Currency</label><select id="acc-currency" class="select" disabled><option value="${state.settings.currency}" selected>${state.settings.currency}</option></select></div><div class="field"><label id="acc-balance-label" for="acc-balance">${['credit','loan'].includes(type)?'Amount currently owed':'Opening balance'}</label><input id="acc-balance" class="input" inputmode="decimal" value="${displayOpening}" placeholder="0.00"><div id="acc-balance-help" class="help">${['credit','loan'].includes(type)?'Enter the amount owed as a positive number. Tally stores it as a liability.':'Balance when you begin tracking this account.'}</div></div><div class="field"><label for="acc-date">Opening date</label><input id="acc-date" class="input" type="date" value="${a?.openingDate||today()}" required></div><div id="acc-debt-fields" class="full form-grid ${['credit','loan'].includes(type)?'':'hidden'}"><div class="field"><label for="acc-rate">Annual interest rate (%)</label><input id="acc-rate" class="input" inputmode="decimal" value="${a?.interestRate||''}" placeholder="e.g. 18.5"></div><div class="field"><label for="acc-payment">Minimum monthly payment</label><input id="acc-payment" class="input" inputmode="decimal" value="${a?.minimumPayment?majorFromMinor(a.minimumPayment,a.currency):''}" placeholder="0.00"></div></div></form>`,footer:`${a?`<button class="btn ghost left" onclick="archiveAccount('${a.id}')">${a.archived?'Restore':'Archive'}</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit" form="account-form">${a?'Save account':'Add account'}</button>`})}
function accountTypeHelp(){const type=document.getElementById('acc-type').value,liability=['credit','loan'].includes(type);document.getElementById('acc-balance-label').textContent=liability?'Amount currently owed':'Opening balance';document.getElementById('acc-balance-help').textContent=liability?'Enter the amount owed as a positive number. Tally stores it as a liability.':'Balance when you begin tracking this account.';document.getElementById('acc-debt-fields').classList.toggle('hidden',!liability)}
function saveAccount(e,id){e.preventDefault();e.stopPropagation();const currency=document.getElementById('acc-currency').value,type=document.getElementById('acc-type').value,name=document.getElementById('acc-name').value.trim(),date=document.getElementById('acc-date').value;let opening=minorFromInput(document.getElementById('acc-balance').value||'0',currency);if(!name||!validDate(date)||!Number.isFinite(opening)){toast('Check the account details','error');return}if(['credit','loan'].includes(type))opening=-Math.abs(opening);const old=id?accountById(id):null,now=Date.now();createSnapshot('Before account change');const next={id:id||uid('acc'),name,type,currency,openingBalance:opening,openingDate:date,color:old?.color||ACCOUNT_TYPES[type].color,archived:old?.archived||false,interestRate:parseDecimal(document.getElementById('acc-rate')?.value)||0,minimumPayment:Math.abs(minorFromInput(document.getElementById('acc-payment')?.value||'0',currency))||0,createdAt:old?.createdAt||now,updatedAt:now};if(id){const i=state.accounts.findIndex(a=>a.id===id);state.accounts[i]=next}else state.accounts.push(next);closeModal(false);saveState();render();toast(id?'Account updated':'Account added');return false}
function archiveAccount(id){const a=accountById(id);if(!a)return;const active=state.accounts.filter(x=>!x.archived).length;if(!a.archived&&active<=1){toast('At least one account must remain active','error');return}if(!a.archived&&accountBalance(a.id)!==0){toast('Move or adjust this account to a zero balance before archiving','error');return}openConfirm({title:`${a.archived?'Restore':'Archive'} account?`,body:'Transactions remain in the ledger and all historical reports stay intact.',confirm:a.archived?'Restore':'Archive',onConfirm:()=>{createSnapshot('Before account archive');a.archived=!a.archived;a.updatedAt=Date.now();saveState();closeModal();render();toast(a.archived?'Account archived':'Account restored')}})}
function openReconcileModal(id){const a=accountById(id);if(!a)return;const liability=isLiability(a),date=today(),ledger=accountBalance(id,date),display=liability?Math.abs(majorFromMinor(ledger,a.currency)):majorFromMinor(ledger,a.currency);openModal({title:`Reconcile ${a.name}`,body:`<form id="reconcile-form" class="stack" onsubmit="saveReconciliation(event,'${id}')"><div class="notice info">${icon('check')}<div><strong>Ledger balance: ${money(ledger,a.currency)}</strong><p>Compare Tally with your latest bank, card or loan statement. Any difference becomes an excluded balance adjustment, so reports and budgets stay unchanged.</p></div></div><div class="form-grid"><div class="field"><label for="reconcile-date">Statement date</label><input id="reconcile-date" class="input" type="date" value="${date}" required onchange="updateReconcileDifference('${id}')"></div><div class="field"><label for="reconcile-balance">${liability?'Amount owed on statement':'Statement balance'}</label><input id="reconcile-balance" class="input" inputmode="decimal" value="${display}" required autofocus oninput="updateReconcileDifference('${id}')"></div></div><div id="reconcile-difference" class="notice info"></div></form>`,footer:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('reconcile-form').requestSubmit()">Reconcile account</button>`,onOpen:()=>updateReconcileDifference(id)})}
function reconciliationValues(id){const a=accountById(id),date=document.getElementById('reconcile-date')?.value||today(),raw=minorFromInput(document.getElementById('reconcile-balance')?.value,a.currency);if(!a||!validDate(date)||!Number.isFinite(raw))return null;const desired=isLiability(a)?-Math.abs(raw):raw,current=accountBalance(id,date);return{a,date,desired,current,diff:desired-current}}
function updateReconcileDifference(id){const box=document.getElementById('reconcile-difference'),v=reconciliationValues(id);if(!box)return;if(!v){box.className='notice warning';box.innerHTML=`${icon('alert')}<div><strong>Enter a valid date and balance</strong></div>`;return}const abs=Math.abs(v.diff);box.className=`notice ${v.diff===0?'info':'warning'}`;box.innerHTML=v.diff===0?`${icon('check')}<div><strong>The account already matches</strong><p>No adjustment transaction is needed.</p></div>`:`${icon('alert')}<div><strong>${money(abs,v.a.currency)} adjustment required</strong><p>Tally will ${v.diff>0?'increase':'decrease'} the ledger balance to ${money(v.desired,v.a.currency)}.</p></div>`}
function saveReconciliation(e,id){e.preventDefault();const v=reconciliationValues(id);if(!v){toast('Check the statement date and balance','error');return}createSnapshot('Before account reconciliation');if(v.diff!==0){const type=v.diff>0?'income':'expense';state.transactions.push({id:uid('tx'),type,amount:Math.abs(v.diff),currency:v.a.currency,date:v.date,accountId:id,categoryId:type==='income'?'cat-other-income':'cat-other-expense',merchant:'Balance adjustment',notes:`Reconciled to ${money(v.desired,v.a.currency)}`,excluded:true,status:'cleared',source:'reconciliation',createdAt:Date.now(),updatedAt:Date.now()})}v.a.lastReconciledDate=v.date;v.a.lastReconciledBalance=v.desired;v.a.updatedAt=Date.now();saveState();closeModal();render();toast(v.diff===0?'Account marked as reconciled':'Account reconciled with an excluded adjustment')}

function openBudgetModal(categoryId){const c=categoryById(categoryId),b=budgetFor(categoryId,ui.month);openModal({title:`${c.name} budget · ${monthLabel(ui.month,{month:'short',year:'numeric'})}`,body:`<form id="budget-form" onsubmit="saveBudget(event,'${categoryId}')"><div class="field"><label for="budget-amount">Monthly limit</label><input id="budget-amount" class="input" autofocus inputmode="decimal" value="${b?majorFromMinor(b.amount,state.settings.currency):''}" placeholder="0.00" required></div><label class="notice info" style="margin-top:14px;cursor:pointer"><input id="budget-rollover" type="checkbox" ${b?.rollover?'checked':''} style="margin-top:3px"><div><strong>Allow unused amount to roll over</strong><p>Stored for future forecasting. Historical monthly limits remain unchanged.</p></div></label></form>`,footer:`${b?`<button class="btn ghost left down" onclick="removeBudget('${categoryId}')">Remove</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('budget-form').requestSubmit()">Save budget</button>`})}
function saveBudget(e,categoryId){e.preventDefault();const amount=Math.abs(minorFromInput(document.getElementById('budget-amount').value,state.settings.currency));if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid budget amount','error');return}let b=budgetFor(categoryId,ui.month);if(b){b.amount=amount;b.rollover=document.getElementById('budget-rollover').checked;b.updatedAt=Date.now()}else state.budgets.push({id:uid('budget'),month:ui.month,categoryId,amount,rollover:document.getElementById('budget-rollover').checked,createdAt:Date.now(),updatedAt:Date.now()});saveState();closeModal();render();toast('Budget saved')}

function openCategoryModal(id=null){const c=id?state.categories.find(x=>x.id===id):null;openModal({title:c?'Edit category':'Add category',body:`<form id="category-form" class="form-grid" onsubmit="saveCategory(event,'${id||''}')"><div class="field full"><label for="cat-name">Name</label><input id="cat-name" class="input" autofocus required maxlength="40" value="${escapeHtml(c?.name||'')}"></div><div class="field"><label for="cat-type">Type</label><select id="cat-type" class="select"><option value="expense" ${(c?.type||'expense')==='expense'?'selected':''}>Expense</option><option value="income" ${c?.type==='income'?'selected':''}>Income</option></select></div><div class="field"><label for="cat-color">Color</label><input id="cat-color" class="input" type="color" value="${c?.color||'#10b981'}" style="padding:4px"></div></form>`,footer:`${c?`<button class="btn ghost left down" onclick="archiveCategory('${c.id}')">Archive</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('category-form').requestSubmit()">Save category</button>`})}
function saveCategory(e,id){e.preventDefault();const name=document.getElementById('cat-name').value.trim(),type=document.getElementById('cat-type').value;if(!name){toast('Enter a category name','error');return}if(state.categories.some(c=>c.id!==id&&!c.archived&&c.type===type&&normalizeText(c.name)===normalizeText(name))){toast('That category already exists','error');return}const old=id?state.categories.find(x=>x.id===id):null,now=Date.now(),c={id:id||uid('cat'),name,type,color:document.getElementById('cat-color').value,icon:old?.icon||'circle',archived:old?.archived||false,createdAt:old?.createdAt||now,updatedAt:now};if(id)state.categories[state.categories.findIndex(x=>x.id===id)]=c;else state.categories.push(c);saveState();closeModal();render();toast('Category saved')}

function restoreCategory(id){const c=state.categories.find(x=>x.id===id);if(!c)return;c.archived=false;c.updatedAt=Date.now();saveState();render();toast('Category restored')}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(quoted){if(ch==='"'&&next==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}if(cell.length||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const headers=rows[0].map(h=>normalizeText(h).replace(/ /g,'_'));return rows.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
function parseImportDate(v){let s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return validDate(s)?s:null;let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);if(y<100)y+=2000;const out=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return validDate(out)?out:null}const d=new Date(s);return Number.isNaN(d.getTime())?null:d.toISOString().slice(0,10)}
function autoCategory(type,merchant){const n=normalizeText(merchant);const learned=state.merchantRules.find(r=>r.type===type&&r.merchant===n&&categoryById(r.categoryId).type===type&&!categoryById(r.categoryId).archived);if(learned)return learned.categoryId;const rules=[['food',['mercadona','carrefour','lidl','aldi','restaurant','cafe','coffee','supermarket','grocery']],['transport',['renfe','metro','uber','cabify','fuel','gasolin','parking','transport']],['housing',['rent','alquiler','mortgage','hipoteca']],['entertainment',['netflix','spotify','cinema','steam','playstation','xbox']],['shopping',['amazon','zara','ikea','shopping']],['health',['pharmacy','farmacia','gym','doctor','health']],['bills',['electric','water','internet','phone','cloud','insurance']],['travel',['hotel','booking','airbnb','flight','ryanair','vueling']]];if(type==='income'){if(/salary|nomina|payroll/.test(n))return 'cat-salary';if(/trading/.test(n))return 'cat-trading';if(/freelance|client/.test(n))return 'cat-freelance';return 'cat-other-income'}for(const [key,words] of rules)if(words.some(w=>n.includes(w)))return `cat-${key}`;return 'cat-other-expense'}
function openImportModal(){openModal({title:'Import transactions',body:`<div class="stack"><div class="notice info">${icon('shield')}<div><strong>Preview before anything is saved</strong><p>Tally validates dates and amounts, identifies exact duplicates and shows rejected rows. No 200-item limit is applied.</p></div></div><div class="field"><label for="import-account">Destination account</label><select id="import-account" class="select">${getAccountOptions()}</select></div><div class="field"><label for="import-file">CSV file</label><input id="import-file" class="input" type="file" accept=".csv,text/csv" onchange="previewImport(this.files[0])"></div><div id="import-preview" class="help">Supported columns include date, amount, description/merchant, type, category and account. Negative generic bank amounts are expenses.</div></div>`,footer:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button id="import-action" class="btn primary" disabled>Import valid rows</button>`,wide:true})}
let pendingImport=null;
function previewImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const rows=parseCSV(String(reader.result||'')),dest=document.getElementById('import-account').value,currency=accountById(dest)?.currency||state.settings.currency;let valid=[],invalid=[],duplicates=[];const seen=new Set(state.transactions.filter(t=>!t.deletedAt).map(transactionFingerprint));for(let i=0;i<rows.length;i++){const r=rows[i];const rawAmount=r.amount??r.importe??r.cantidad??r.monto??r.value;const n=parseDecimal(rawAmount);const date=parseImportDate(r.date??r.fecha??r.data);if(!Number.isFinite(n)||n===0||!date){invalid.push({row:i+2,reason:!date?'Invalid date':'Invalid amount'});continue}let type=normalizeText(r.type||r.tipo);if(!['income','expense'].includes(type))type=n<0?'expense':'income';const amount=Math.abs(minorFromInput(Math.abs(n),currency));const merchant=String(r.description||r.descripcion||r.descrip||r.merchant||r.concepto||r.notes||'').trim().slice(0,140);const accountName=normalizeText(r.account||r.cuenta||''),account=accountName?state.accounts.find(a=>normalizeText(a.name)===accountName):null;const categoryName=normalizeText(r.category||r.categoria||''),category=categoryName?state.categories.find(c=>c.type===type&&normalizeText(c.name)===categoryName):null;const tx={id:uid('tx'),type,amount,currency,date,accountId:account?.id||dest,categoryId:category?.id||autoCategory(type,merchant),merchant,notes:'Imported from CSV',excluded:false,status:'cleared',source:'csv',createdAt:Date.now(),updatedAt:Date.now()};const fp=transactionFingerprint(tx);if(seen.has(fp))duplicates.push({row:i+2,tx});else{seen.add(fp);valid.push(tx)}}pendingImport={valid,invalid,duplicates,fileName:file.name};document.getElementById('import-preview').innerHTML=`<div class="grid three"><div class="metric"><span>Ready</span><strong class="up">${valid.length}</strong></div><div class="metric"><span>Exact duplicates skipped</span><strong>${duplicates.length}</strong></div><div class="metric"><span>Rejected</span><strong class="${invalid.length?'down':''}">${invalid.length}</strong></div></div>${invalid.length?`<div class="notice warning" style="margin-top:12px">${icon('alert')}<div><strong>Rejected rows</strong><p>${invalid.slice(0,8).map(x=>`Row ${x.row}: ${x.reason}`).join(' · ')}${invalid.length>8?' · …':''}</p></div></div>`:''}`;const btn=document.getElementById('import-action');btn.disabled=!valid.length;btn.onclick=commitImport};reader.onerror=()=>toast('Could not read that CSV','error');reader.readAsText(file)}
function commitImport(){if(!pendingImport?.valid.length)return;createSnapshot('Before CSV import');state.transactions.push(...pendingImport.valid);state.importBatches.push({id:uid('import'),fileName:pendingImport.fileName,imported:pendingImport.valid.length,duplicates:pendingImport.duplicates.length,rejected:pendingImport.invalid.length,createdAt:Date.now()});saveState();const n=pendingImport.valid.length;pendingImport=null;closeModal();render();toast(`${n} transaction${n===1?'':'s'} imported`)}
function exportCSV(){const headers=['id','type','date','amount','currency','account','from_account','to_account','category','merchant','notes','excluded'];const lines=[headers.join(',')];for(const t of state.transactions.filter(t=>!t.deletedAt)){lines.push([t.id,t.type,t.date,majorFromMinor(t.amount,t.currency||state.settings.currency),t.currency||state.settings.currency,accountById(t.accountId)?.name||'',accountById(t.fromAccountId)?.name||'',accountById(t.toAccountId)?.name||'',categoryById(t.categoryId).name,t.merchant||'',t.notes||'',t.excluded?'true':'false'].map(csvEscape).join(','))}downloadFile(`tally-transactions-${today()}.csv`,lines.join('\n'),'text/csv')}
function exportBackup(){const payload={app:'tally',schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),data:state};downloadFile(`tally-full-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json');state.meta.lastBackupAt=Date.now();saveState();toast('Full backup downloaded')}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bytesToB64(bytes){let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(bin)}
function b64ToBytes(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function deriveBackupKey(passphrase,salt,iterations=250000){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

/* ---------- Quick capture from a link: ?add=12,34@Merchant ---------- */
/* Used by the iOS Shortcuts "Transaction" automation and by manual shortcuts.
   Accepted forms:  12,34@Mercadona   ·   4,50 cafe   ·   +300@Client (income) */
function readQuickAddParam(){
  const search=location.search||'';
  if(!/[?&]?add=/.test(search))return null;
  const parts=search.replace(/^\?/,'').split('&').filter(Boolean);
  const hit=parts.find(p=>p.startsWith('add='));
  if(hit===undefined)return null;
  const rest=parts.filter(p=>p!==hit);
  try{history.replaceState(null,'',location.pathname+(rest.length?'?'+rest.join('&'):'')+location.hash)}catch{}
  const raw=hit.slice(4);
  try{return decodeURIComponent(raw)}catch{return raw}
}
function parseQuickAdd(text){
  let s=String(text||'').replace(/\u00a0/g,' ').trim();
  if(!s)return null;
  let type='expense';
  if(s.startsWith('+')){type='income';s=s.slice(1).trim()}
  else if(s.startsWith('-')){s=s.slice(1).trim()}
  let amountText=s,merchant='';
  const at=s.indexOf('@');
  if(at>=0){amountText=s.slice(0,at);merchant=s.slice(at+1)}
  else{const m=s.match(/^([\d.,]+)\s*(?:€|eur|\$|usd|£|gbp|chf|¥|jpy)?\s*(.*)$/i);if(m){amountText=m[1];merchant=m[2]}}
  const currency=state.settings.currency;
  const minor=minorFromInput(amountText,currency);
  if(!Number.isFinite(minor)||Math.abs(minor)<=0)return null;
  return {type,amount:Math.abs(minor),merchant:merchant.trim().slice(0,140),currency}
}
function handleQuickAddLink(){
  const raw=readQuickAddParam();
  if(raw===null)return;
  const parsed=parseQuickAdd(raw);
  if(!parsed){toast('Could not read an amount from that link','error');return}
  const digits=(CURRENCIES[parsed.currency]||CURRENCIES.EUR).digits;
  openTransactionModal(null,{
    type:parsed.type,
    amount:majorFromMinor(parsed.amount,parsed.currency).toFixed(digits),
    merchant:parsed.merchant,
    categoryId:parsed.merchant?autoCategory(parsed.type,parsed.merchant):'',
    date:today()
  });
  setTimeout(()=>{try{document.activeElement?.blur?.()}catch{}},40);
}

render();
handleQuickAddLink();
if(ui.driveAutoStarting)setTimeout(()=>driveAutoStart(),700);
if(state.meta.lastMigrationAt&&Date.now()-state.meta.lastMigrationAt<120000)setTimeout(()=>toast('Existing Tally data migrated safely to the new account-based ledger'),450);
</script>
</body>
</html>
